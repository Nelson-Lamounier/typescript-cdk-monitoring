# @format

# .github/workflows/deploy-monitoring-development.yml // testing
name: Deploy Monitoring to Development

on:
  push:
    branches:
      - develop
    paths:
      - "lib/stacks/**"
      - "bin/**"
      - "config/**"
      - "scripts/deployment/**"
      - "Makefile"
      - ".github/workflows/deploy-monitoring.yml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (use for hotfixes only)"
        type: boolean
        default: false

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'eu-west-1' }}
  AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}
  ENVIRONMENT: "development"
  PROJECT_NAME: "monitoring"

permissions:
  id-token: write
  contents: read

jobs:
  # =================================================================
  # Setup & Build
  # =================================================================
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    environment: development
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      aws-account-id: ${{ steps.account-id.outputs.account_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Cache Key
        id: cache-key
        run: |
          HASH=$(find lib bin config scripts -name "*.ts" -o -name "package.json" | \
                 sort | xargs cat | sha256sum | cut -d' ' -f1)
          echo "key=build-${{ runner.os }}-$HASH" >> $GITHUB_OUTPUT

      - name: Get AWS Account ID
        id: account-id
        run: |
          ACCOUNT_ID="${{ env.AWS_ACCOUNT_ID_DEV || vars.AWS_ACCOUNT_ID_DEV }}"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::AWS_ACCOUNT_ID_DEV not configured in repository or environment variables"
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist
            node_modules
            .turbo
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: build-${{ runner.os }}-

      - name: Build TypeScript
        run: |
          echo "Building TypeScript..."
          yarn build

  # =================================================================
  # Deploy Networking Stack
  # =================================================================
  deploy-networking:
    name: Deploy Networking Stack
    needs: setup
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CDK Deployment Environment
        uses: ./.github/actions/setup-cdk-deployment
        with:
          node-version: ${{ env.NODE_VERSION }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          build-cache-key: ${{ needs.setup.outputs.cache-key }}
          environment-name: ${{ env.ENVIRONMENT }}

      - name: Deploy Networking Stack
        id: deploy-networking
        uses: ./.github/actions/deploy-cdk-stack
        with:
          stack-name: ${{ env.ENVIRONMENT }}-Networking
          environment: ${{ env.ENVIRONMENT }}
          project-name: ${{ env.PROJECT_NAME }}
          aws-account-id: ${{ needs.setup.outputs.aws-account-id }}
          aws-region: ${{ env.AWS_REGION }}
          additional-args: "--require-approval never"
        env:
          # CDK automatically uses bootstrap roles for cross-account deployment
          # Prerequisites:
          # 1. Development account must be bootstrapped with: cdk bootstrap aws://<dev-account-id>/<region> --trust <pipeline-account-id>
          # 2. Pipeline account's OIDC role must be trusted by the bootstrap deploy role
          # CDK will automatically assume the bootstrap deploy role when deploying to a different account
          CDK_DEFAULT_ACCOUNT: ${{ needs.setup.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Debug Stack Outputs Directory
        if: always()
        run: |
          echo "Listing stack outputs directory in workspace..."
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/.deployment-outputs" || true

      - name: Save Stack Outputs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENVIRONMENT }}-Networking-outputs
          path: ${{ github.workspace }}/.deployment-outputs/${{ env.ENVIRONMENT }}-Networking-*.json
          retention-days: 90
          if-no-files-found: ignore
          include-hidden-files: true

    # =================================================================
  # Verify Networking Stack
  # =================================================================
  verify-networking:
    name: Verify Networking Stack
    needs: [deploy-networking]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Networking Stack
        run: |
          echo "Verifying Networking Stack deployment..."
          make verify-networking \
            ENVIRONMENT=${{ env.ENVIRONMENT }} \
            AWS_REGION=${{ env.AWS_REGION }}

  # =================================================================
  # Deploy EFS Stack
  # =================================================================
  deploy-efs:
    name: Deploy EFS Stack
    needs: [setup, deploy-networking, verify-networking]
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CDK Deployment Environment
        uses: ./.github/actions/setup-cdk-deployment
        with:
          node-version: ${{ env.NODE_VERSION }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          build-cache-key: ${{ needs.setup.outputs.cache-key }}
          environment-name: ${{ env.ENVIRONMENT }}

      - name: Deploy EFS Stack
        id: deploy-efs
        uses: ./.github/actions/deploy-cdk-stack
        with:
          stack-name: ${{ env.ENVIRONMENT }}-MonitoringEfs
          environment: ${{ env.ENVIRONMENT }}
          project-name: ${{ env.PROJECT_NAME }}
          aws-account-id: ${{ needs.setup.outputs.aws-account-id }}
          aws-region: ${{ env.AWS_REGION }}
          additional-args: "--require-approval never"
        env:
          # CDK automatically uses bootstrap roles for cross-account deployment
          # Ensure development account is bootstrapped with --trust pointing to pipeline account's OIDC role
          CDK_DEFAULT_ACCOUNT: ${{ needs.setup.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Debug Stack Outputs Directory
        if: always()
        run: |
          echo "Listing stack outputs directory in workspace..."
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/.deployment-outputs" || true

      - name: Save Stack Outputs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENVIRONMENT }}-MonitoringEfs-outputs
          path: ${{ github.workspace }}/.deployment-outputs/${{ env.ENVIRONMENT }}-MonitoringEfs-*.json
          retention-days: 90
          if-no-files-found: ignore
          include-hidden-files: true
  # =================================================================
  # Verify EFS Stack
  # =================================================================
  verify-efs:
    name: Verify EFS Stack
    needs: [deploy-efs]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EFS Stack
        run: |
          echo "Verifying EFS Stack deployment..."
          make verify-efs \
            ENVIRONMENT=${{ env.ENVIRONMENT }} \
            AWS_REGION=${{ env.AWS_REGION }}

  # =================================================================
  # Deploy Infrastructure Stack
  # =================================================================
  deploy-infra:
    name: Deploy Infrastructure Stack
    needs: [setup, deploy-efs, verify-efs]
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CDK Deployment Environment
        uses: ./.github/actions/setup-cdk-deployment
        with:
          node-version: ${{ env.NODE_VERSION }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          build-cache-key: ${{ needs.setup.outputs.cache-key }}
          environment-name: ${{ env.ENVIRONMENT }}

      - name: Deploy Infrastructure Stack
        id: deploy-infra
        uses: ./.github/actions/deploy-cdk-stack
        with:
          stack-name: ${{ env.ENVIRONMENT }}-MonitoringInfra
          environment: ${{ env.ENVIRONMENT }}
          project-name: ${{ env.PROJECT_NAME }}
          aws-account-id: ${{ needs.setup.outputs.aws-account-id }}
          aws-region: ${{ env.AWS_REGION }}
          additional-args: "--require-approval never"
        env:
          # CDK automatically uses bootstrap roles for cross-account deployment
          # Ensure development account is bootstrapped with --trust pointing to pipeline account's OIDC role
          CDK_DEFAULT_ACCOUNT: ${{ needs.setup.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Save Stack Outputs Artifact
        if: steps.deploy-infra.outputs.stack-outputs != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENVIRONMENT }}-MonitoringInfra-outputs
          path: .deployment-outputs/${{ env.ENVIRONMENT }}-MonitoringInfra-*.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Verify Infrastructure Stack
        run: |
          echo "Verifying Infrastructure Stack deployment..."
          make verify-infra \
            ENVIRONMENT=${{ env.ENVIRONMENT }} \
            AWS_REGION=${{ env.AWS_REGION }}

  # =================================================================
  # Deploy Service Stack
  # =================================================================
  deploy-service:
    name: Deploy Service Stack
    needs: [setup, deploy-infra]
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CDK Deployment Environment
        uses: ./.github/actions/setup-cdk-deployment
        with:
          node-version: ${{ env.NODE_VERSION }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          build-cache-key: ${{ needs.setup.outputs.cache-key }}
          environment-name: ${{ env.ENVIRONMENT }}

      - name: Deploy Service Stack
        id: deploy-service
        uses: ./.github/actions/deploy-cdk-stack
        with:
          stack-name: ${{ env.ENVIRONMENT }}-MonitoringService
          environment: ${{ env.ENVIRONMENT }}
          project-name: ${{ env.PROJECT_NAME }}
          aws-account-id: ${{ needs.setup.outputs.aws-account-id }}
          aws-region: ${{ env.AWS_REGION }}
          additional-args: "--require-approval never"
        env:
          # CDK automatically uses bootstrap roles for cross-account deployment
          # Ensure development account is bootstrapped with --trust pointing to pipeline account's OIDC role
          CDK_DEFAULT_ACCOUNT: ${{ needs.setup.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Save Stack Outputs Artifact
        if: steps.deploy-service.outputs.stack-outputs != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENVIRONMENT }}-MonitoringService-outputs
          path: .deployment-outputs/${{ env.ENVIRONMENT }}-MonitoringService-*.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Verify Service Stack
        run: |
          echo "Verifying Service Stack deployment..."
          make verify-service \
            ENVIRONMENT=${{ env.ENVIRONMENT }} \
            AWS_REGION=${{ env.AWS_REGION }}

  # =================================================================
  # Final Verification & Summary
  # =================================================================
  deployment-summary:
    name: Deployment Summary
    needs: [deploy-networking, deploy-efs, deploy-infra, deploy-service]
    runs-on: ubuntu-latest
    environment: development
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Development Account Role
        if: env.ENVIRONMENT == 'development'
        run: |
          TARGET_ACCOUNT="${{ env.AWS_ACCOUNT_ID_DEV }}"
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          if [ "$CURRENT_ACCOUNT" != "$TARGET_ACCOUNT" ]; then
            echo "Assuming cross-account role for development account..."
            ROLE_ARN="arn:aws:iam::${TARGET_ACCOUNT}:role/GitHubDeploymentRole"
            
            # Suppress AWS CLI output to prevent credential exposure
            CREDS=$(aws sts assume-role \
              --role-arn "$ROLE_ARN" \
              --role-session-name "GitHubActions-$(date +%s)" \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text \
              --no-cli-pager 2>&1)
            
            if [ $? -ne 0 ]; then
              echo "ERROR: Failed to assume role"
              echo "Error details: $CREDS" | sed 's/\(SecretAccessKey\|SessionToken\):[^ ]*/***MASKED***/g'
              exit 1
            fi
            
            read ACCESS_KEY SECRET_KEY SESSION_TOKEN <<< "$CREDS"
            
            # Mask credentials immediately after extraction (before any logging)
            echo "::add-mask::${ACCESS_KEY}"
            echo "::add-mask::${SECRET_KEY}"
            echo "::add-mask::${SESSION_TOKEN}"
            
            echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> $GITHUB_ENV
            echo "AWS_SESSION_TOKEN=$SESSION_TOKEN" >> $GITHUB_ENV
            
            VERIFIED_ACCOUNT=$(AWS_ACCESS_KEY_ID="$ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$SECRET_KEY" AWS_SESSION_TOKEN="$SESSION_TOKEN" aws sts get-caller-identity --query Account --output text)
            if [ "$VERIFIED_ACCOUNT" != "$TARGET_ACCOUNT" ]; then
              echo "ERROR: Failed to assume development account role"
              exit 1
            fi
            echo "✓ Successfully assumed development account role"
          fi

      - name: Get Service Endpoints
        id: endpoints
        run: |
          STACK_NAME="${{ env.ENVIRONMENT }}-MonitoringInfra"

          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerDns`].OutputValue' \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_DNS" ]; then
            echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          fi

      - name: Generate Deployment Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Monitoring Infrastructure Deployment - ${{ env.ENVIRONMENT }}

          **Environment**: ${{ env.ENVIRONMENT }}
          **Region**: ${{ env.AWS_REGION }}
          **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### Deployment Status

          | Stack | Status |
          |-------|--------|
          | Networking | ${{ needs.deploy-networking.result }} |
          | EFS | ${{ needs.deploy-efs.result }} |
          | Infrastructure | ${{ needs.deploy-infra.result }} |
          | Service | ${{ needs.deploy-service.result }} |

          ### Access Points

          EOF

          if [ -n "${{ steps.endpoints.outputs.alb_dns }}" ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          - **Grafana Dashboard**: http://${{ steps.endpoints.outputs.alb_dns }}/grafana
          - **Prometheus Metrics**: http://${{ steps.endpoints.outputs.alb_dns }}/prometheus
          EOF
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ### Next Steps

          1. Verify all stacks are healthy: \`make verify-all ENVIRONMENT=${{ env.ENVIRONMENT }}\`
          2. Check CloudWatch logs for any errors
          3. Access Grafana and change default password (admin/admin)

          EOF

      - name: Check Deployment Status
        run: |
          if [[ "${{ needs.deploy-networking.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-efs.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-infra.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-service.result }}" != "success" ]]; then
            echo "One or more stacks failed to deploy"
            exit 1
          fi
          echo "All stacks deployed successfully"
