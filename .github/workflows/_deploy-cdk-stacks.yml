# @format

# .github/workflows/_deploy-cdk-stacks.yml
name: Deploy CDK Stacks

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment (pipeline, development, production)"
        required: true
        type: string
      stacks:
        description: "JSON array of stack names (without environment suffix)"
        required: true
        type: string
      cache-key:
        description: "Build cache key from build job"
        required: false
        type: string
    secrets:
      AWS_OIDC_ROLE:
        required: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  NODE_VERSION: "22"

jobs:
  deploy:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    strategy:
      matrix:
        stack: ${{ fromJson(inputs.stacks) }}
      max-parallel: 1 # Deploy sequentially to respect dependencies
      fail-fast: true # Stop if any deployment fails

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Build Cache
        if: inputs.cache-key != ''
        uses: actions/cache@v4
        with:
          path: |
            infrastructure/dist
            infrastructure/node_modules
            infrastructure/.turbo
          key: ${{ inputs.cache-key }}
          restore-keys: build-${{ runner.os }}-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account Info
        id: aws-info
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "Deploying to account: ***${ACCOUNT_ID: -4}"

      - name: Deploy Stack
        id: deploy
        run: |
          cd infrastructure
          STACK_NAME="${{ matrix.stack }}-${{ inputs.environment }}"

          echo "🚀 Deploying $STACK_NAME..."

          ENVIRONMENT=${{ inputs.environment }} \
            npx cdk deploy "$STACK_NAME" \
            --require-approval never \
            --outputs-file cdk-outputs-${{ matrix.stack }}.json

          echo "✅ Successfully deployed $STACK_NAME"
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-info.outputs.account_id }}
          AWS_ACCOUNT_ID_DEV: ${{ vars.AWS_ACCOUNT_ID_DEV }}

      - name: Save Stack Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.stack }}-outputs
          path: infrastructure/cdk-outputs-${{ matrix.stack }}.json
          retention-days: 30

      - name: Handle Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment failed for ${{ matrix.stack }}"
          echo ""
          echo "CloudFormation will automatically rollback the stack."
          echo "Check the AWS CloudFormation console for detailed error information."
          echo ""
          echo "Stack: ${{ matrix.stack }}-${{ inputs.environment }}"
          echo "Region: ${{ env.AWS_REGION }}"
          exit 1
