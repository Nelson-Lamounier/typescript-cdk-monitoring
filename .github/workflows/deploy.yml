# @format

name: Continuous Deployment

on:
  push:
    branches:
      - main
      - develop # Remove after testing
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: "pipeline"
        options:
          - pipeline
          - development
          - staging
          - production
      stack:
        description: "Stack to deploy"
        required: true
        type: choice
        default: "networking"
        options:
          - networking
          - ebs-storage
          - ecs
          - load-balancer
          - launch-template
          - vpc-peering
          - destroy-all
      jobs_to_run:
        description: "Jobs to run (comma-separated or 'all' or 'failed')"
        required: false
        type: string
        default: "all"
      rerun_failed_from:
        description: "Run ID to re-run failed jobs from (leave empty for normal run)"
        required: false
        type: string
        default: ""
      enable_drift_detection:
        description: "Enable infrastructure drift detection after deployment"
        required: false
        type: boolean
        default: true
      drift_threshold:
        description: "Maximum drift count before failing (0 = fail on any drift)"
        required: false
        type: string
        default: "5"
      skip_validation:
        description: "Skip pre-deployment validation"
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Environment is determined from workflow input or defaults to pipeline
  DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'pipeline' }}

permissions:
  id-token: write
  contents: read
  actions: read
  # CD jobs require deployment permissions via OIDC

jobs:
  # ============================================================================
  # JOB 0: Determine Deployment Jobs to Run
  # ============================================================================
  determine-jobs:
    name: Determine Deployment Jobs to Run
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.decide.outputs.environment }}
      run_build: ${{ steps.decide.outputs.run_build }}
      run_validate_setup: ${{ steps.decide.outputs.run_validate_setup }}
      run_deploy_networking: ${{ steps.decide.outputs.run_deploy_networking }}
      run_deploy_ebs_storage: ${{ steps.decide.outputs.run_deploy_ebs_storage }}
      run_deploy_ecs: ${{ steps.decide.outputs.run_deploy_ecs }}
      run_deploy_load_balancer: ${{ steps.decide.outputs.run_deploy_load_balancer }}
      run_deploy_launch_template: ${{ steps.decide.outputs.run_deploy_launch_template }}
      run_deploy_peering: ${{ steps.decide.outputs.run_deploy_peering }}
      run_health_checks: ${{ steps.decide.outputs.run_health_checks }}
      run_destroy_all: ${{ steps.decide.outputs.run_destroy_all }}
      run_rollback: ${{ steps.decide.outputs.run_rollback }}
      run_drift_detection: ${{ steps.decide.outputs.run_drift_detection }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          # GitHub CLI is pre-installed on GitHub runners
          gh --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine Which Jobs to Run
        id: decide
        run: |
          JOBS_INPUT="${{ github.event.inputs.jobs_to_run }}"
          RERUN_FROM="${{ github.event.inputs.rerun_failed_from }}"
          STACK_INPUT="${{ github.event.inputs.stack }}"
          ENVIRONMENT="${{ env.DEPLOY_ENVIRONMENT }}"
          
          echo "Deployment Environment: $ENVIRONMENT"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

          echo "Input parameters:"
          echo "  Jobs to run: $JOBS_INPUT"
          echo "  Rerun from: $RERUN_FROM"
          echo "  Stack: $STACK_INPUT"
          echo ""

          # If rerun_failed_from is specified, check which jobs failed
          if [ -n "$RERUN_FROM" ]; then
            echo "Analyzing failed jobs from run $RERUN_FROM..."
            echo ""
            
            # Validate run ID format
            if ! [[ "$RERUN_FROM" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Run ID must be a numeric value"
              echo "Provided: '$RERUN_FROM'"
              echo "Expected: A numeric GitHub Actions run ID (e.g., 1234567890)"
              exit 1
            fi
            
            # Get failed jobs from previous run with error handling
            echo "Fetching run information from GitHub API..."
            if ! RUN_INFO=$(gh run view "$RERUN_FROM" --json jobs,status,conclusion 2>&1); then
              echo "WARNING: Cannot access run $RERUN_FROM"
              echo "GitHub CLI Error: $RUN_INFO"
              echo "FALLBACK: Running all jobs instead"
              RERUN_FROM=""
            else
              echo "Successfully retrieved run information"
              
              # Get failed jobs from previous run
              FAILED_JOBS=$(echo "$RUN_INFO" | jq -r '.jobs[] | select(.conclusion == "failure") | .name' || echo "")
              
              if [ -n "$FAILED_JOBS" ]; then
                FAILED_COUNT=$(echo "$FAILED_JOBS" | wc -l)
                echo "Found $FAILED_COUNT failed job(s):"
                echo "$FAILED_JOBS" | sed 's/^/    /'
                echo ""
                
                # Set outputs based on failed jobs (deployment jobs only)
                echo "$FAILED_JOBS" | grep -q "Build Infrastructure" && echo "run_build=true" >> $GITHUB_OUTPUT || echo "run_build=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Validate & Setup" && echo "run_validate_setup=true" >> $GITHUB_OUTPUT || echo "run_validate_setup=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Deploy Networking" && echo "run_deploy_networking=true" >> $GITHUB_OUTPUT || echo "run_deploy_networking=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Deploy EBS Storage\|Deploy Monitoring EBS Storage" && echo "run_deploy_ebs_storage=true" >> $GITHUB_OUTPUT || echo "run_deploy_ebs_storage=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Deploy ECS\|Deploy Monitoring ECS" && echo "run_deploy_ecs=true" >> $GITHUB_OUTPUT || echo "run_deploy_ecs=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Deploy Load Balancer" && echo "run_deploy_load_balancer=true" >> $GITHUB_OUTPUT || echo "run_deploy_load_balancer=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Deploy Launch Template" && echo "run_deploy_launch_template=true" >> $GITHUB_OUTPUT || echo "run_deploy_launch_template=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Deploy VPC Peering" && echo "run_deploy_peering=true" >> $GITHUB_OUTPUT || echo "run_deploy_peering=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Health Checks" && echo "run_health_checks=true" >> $GITHUB_OUTPUT || echo "run_health_checks=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Destroy All" && echo "run_destroy_all=true" >> $GITHUB_OUTPUT || echo "run_destroy_all=false" >> $GITHUB_OUTPUT
                echo "$FAILED_JOBS" | grep -q "Rollback" && echo "run_rollback=true" >> $GITHUB_OUTPUT || echo "run_rollback=false" >> $GITHUB_OUTPUT
                
                # Always run dependencies of failed deployment jobs
                if echo "$FAILED_JOBS" | grep -q "Deploy\|Health"; then
                  echo "Adding dependencies for deployment jobs..."
                  echo "run_build=true" >> $GITHUB_OUTPUT
                  echo "run_validate_setup=true" >> $GITHUB_OUTPUT
                fi
                
                # Enable drift detection by default if enabled in inputs
                if [ "${{ github.event.inputs.enable_drift_detection }}" = "true" ] || [ -z "${{ github.event.inputs.enable_drift_detection }}" ]; then
                  echo "run_drift_detection=true" >> $GITHUB_OUTPUT
                else
                  echo "run_drift_detection=false" >> $GITHUB_OUTPUT
                fi
              else
                echo "No failed jobs found - running all jobs instead"
                echo "run_build=true" >> $GITHUB_OUTPUT
                echo "run_validate_setup=true" >> $GITHUB_OUTPUT
                echo "run_deploy_networking=true" >> $GITHUB_OUTPUT
                echo "run_deploy_ebs_storage=true" >> $GITHUB_OUTPUT
                echo "run_deploy_ecs=true" >> $GITHUB_OUTPUT
                echo "run_deploy_load_balancer=true" >> $GITHUB_OUTPUT
                echo "run_deploy_launch_template=true" >> $GITHUB_OUTPUT
                echo "run_deploy_peering=true" >> $GITHUB_OUTPUT
                echo "run_health_checks=true" >> $GITHUB_OUTPUT
                echo "run_destroy_all=false" >> $GITHUB_OUTPUT
                echo "run_rollback=false" >> $GITHUB_OUTPUT
                if [ "${{ github.event.inputs.enable_drift_detection }}" = "true" ] || [ -z "${{ github.event.inputs.enable_drift_detection }}" ]; then
                  echo "run_drift_detection=true" >> $GITHUB_OUTPUT
                else
                  echo "run_drift_detection=false" >> $GITHUB_OUTPUT
                fi
              fi
            fi
            
          elif [ "$JOBS_INPUT" = "all" ] || [ -z "$JOBS_INPUT" ]; then
            echo "Running all deployment jobs (default behavior)"
            echo "run_build=true" >> $GITHUB_OUTPUT
            echo "run_validate_setup=true" >> $GITHUB_OUTPUT
            echo "run_deploy_networking=true" >> $GITHUB_OUTPUT
            echo "run_deploy_ebs_storage=true" >> $GITHUB_OUTPUT
            echo "run_deploy_ecs=true" >> $GITHUB_OUTPUT
            echo "run_deploy_load_balancer=true" >> $GITHUB_OUTPUT
            echo "run_deploy_launch_template=true" >> $GITHUB_OUTPUT
            echo "run_deploy_peering=true" >> $GITHUB_OUTPUT
            echo "run_health_checks=true" >> $GITHUB_OUTPUT
            echo "run_destroy_all=false" >> $GITHUB_OUTPUT
            echo "run_rollback=false" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.enable_drift_detection }}" = "true" ] || [ -z "${{ github.event.inputs.enable_drift_detection }}" ]; then
              echo "run_drift_detection=true" >> $GITHUB_OUTPUT
            else
              echo "run_drift_detection=false" >> $GITHUB_OUTPUT
            fi
            
          else
            echo "Running selective deployment jobs: $JOBS_INPUT"
            # Parse comma-separated job list - start with all false
            echo "run_build=false" >> $GITHUB_OUTPUT
            echo "run_validate_setup=false" >> $GITHUB_OUTPUT
            echo "run_deploy_networking=false" >> $GITHUB_OUTPUT
            echo "run_deploy_ebs_storage=false" >> $GITHUB_OUTPUT
            echo "run_deploy_ecs=false" >> $GITHUB_OUTPUT
            echo "run_deploy_load_balancer=false" >> $GITHUB_OUTPUT
            echo "run_deploy_launch_template=false" >> $GITHUB_OUTPUT
            echo "run_deploy_peering=false" >> $GITHUB_OUTPUT
            echo "run_health_checks=false" >> $GITHUB_OUTPUT
            echo "run_destroy_all=false" >> $GITHUB_OUTPUT
            echo "run_rollback=false" >> $GITHUB_OUTPUT
            echo "run_drift_detection=false" >> $GITHUB_OUTPUT

            # Enable specified jobs (case-insensitive matching)
            JOBS_LOWER=$(echo "$JOBS_INPUT" | tr '[:upper:]' '[:lower:]')
            
            echo "$JOBS_LOWER" | grep -q "build" && echo "run_build=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "validate\|setup" && echo "run_validate_setup=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "networking" && echo "run_deploy_networking=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "ebs.*storage\|storage.*ebs\|ebs-storage" && echo "run_deploy_ebs_storage=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "ecs\|monitoring-ecs" && echo "run_deploy_ecs=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "load.*balancer\|alb" && echo "run_deploy_load_balancer=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "launch.*template" && echo "run_deploy_launch_template=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "peering\|vpc" && echo "run_deploy_peering=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "health" && echo "run_health_checks=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "destroy" && echo "run_destroy_all=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "rollback" && echo "run_rollback=true" >> $GITHUB_OUTPUT
            echo "$JOBS_LOWER" | grep -q "drift" && echo "run_drift_detection=true" >> $GITHUB_OUTPUT
            
            # Auto-enable dependencies for deployment jobs
            if echo "$JOBS_LOWER" | grep -q "deploy\|health"; then
              echo "Auto-enabling dependencies for deployment jobs..."
              echo "run_build=true" >> $GITHUB_OUTPUT
              echo "run_validate_setup=true" >> $GITHUB_OUTPUT
            fi
          fi

          # Handle stack-specific logic
          if [ "$STACK_INPUT" = "destroy-all" ]; then
            echo "Destroy-all stack selected - enabling destroy job"
            echo "run_destroy_all=true" >> $GITHUB_OUTPUT
            # Disable deployment jobs for destroy
            echo "run_deploy_networking=false" >> $GITHUB_OUTPUT
            echo "run_deploy_ebs_storage=false" >> $GITHUB_OUTPUT
            echo "run_deploy_ecs=false" >> $GITHUB_OUTPUT
            echo "run_deploy_load_balancer=false" >> $GITHUB_OUTPUT
            echo "run_deploy_launch_template=false" >> $GITHUB_OUTPUT
            echo "run_deploy_peering=false" >> $GITHUB_OUTPUT
            echo "run_health_checks=false" >> $GITHUB_OUTPUT
          fi

          echo ""
          echo "Deployment job execution plan determined:"
          echo "  Build: $(grep 'run_build=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
          echo "  Validate Setup: $(grep 'run_validate_setup=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
            echo "  Deploy Networking: $(grep 'run_deploy_networking=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
            echo "  Deploy EBS Storage: $(grep 'run_deploy_ebs_storage=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
            echo "  Deploy ECS: $(grep 'run_deploy_ecs=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
            echo "  Deploy Load Balancer: $(grep 'run_deploy_load_balancer=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
            echo "  Deploy Launch Template: $(grep 'run_deploy_launch_template=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
            echo "  Deploy VPC Peering: $(grep 'run_deploy_peering=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
          echo "  Health Checks: $(grep 'run_health_checks=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
          echo "  Destroy All: $(grep 'run_destroy_all=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
          echo "  Rollback: $(grep 'run_rollback=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
          echo "  Drift Detection: $(grep 'run_drift_detection=' $GITHUB_OUTPUT | cut -d'=' -f2 | tail -1)"
        env:
          GH_TOKEN: ${{ github.token }}

  # ============================================================================
  # JOB 1: Build & Cache (Required for deployments)
  # ============================================================================
  build:
    name: Build Infrastructure
    needs: [determine-jobs]
    runs-on: ubuntu-latest
    if: needs.determine-jobs.outputs.run_build == 'true'
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Cache Key
        id: cache-key
        run: |
          HASH=$(find lib bin config tests -name "*.ts" -o -name "*.js" -o -name "*.json" 2>/dev/null | xargs cat 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "key=build-${{ runner.os }}-$HASH" >> $GITHUB_OUTPUT

      - name: Setup Infrastructure Environment
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/**/*.js
            dist/**/*.js.map
            dist/**/*.d.ts
            cdk.out
            node_modules
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Build TypeScript
        run: |
          echo "Building TypeScript code..."
          yarn build

          echo "Build Results:"
          # TypeScript compiles to dist/ directory (as configured in tsconfig.json)
          # Check for compiled JavaScript files in dist/ directory
          JS_FILES=$(find dist -name "*.js" 2>/dev/null | wc -l)

          if [ "$JS_FILES" -gt 0 ]; then
            echo "Build successful: $JS_FILES JavaScript files created"
            echo "Compiled files found in:"
            find dist -name "*.js" 2>/dev/null | head -10
          else
            echo "WARNING: No compiled JavaScript files found"
            echo "This may be expected if TypeScript compilation only validates types"
            echo "Checking for TypeScript compilation errors..."
            
            # Verify build completed without errors by checking exit code
            if [ $? -eq 0 ]; then
              echo "TypeScript compilation completed successfully"
              echo "Note: CDK uses ts-node and doesn't require compiled JavaScript files"
            else
              echo "Build failed: TypeScript compilation errors detected"
              exit 1
            fi
          fi

      - name: CDK Synth for Validation
        run: |
          ENVIRONMENT="${{ needs.determine-jobs.outputs.environment }}"
          
          # First list available stacks to debug
          echo "Available CDK stacks for environment: $ENVIRONMENT"
          CDK_ENVIRONMENT="$ENVIRONMENT" npx cdk list --context environment="$ENVIRONMENT"
          echo ""

          # Synthesize NetworkingStack for build validation
          echo "Synthesizing NetworkingStack-$ENVIRONMENT..."
          CDK_ENVIRONMENT="$ENVIRONMENT" npx cdk synth "NetworkingStack-$ENVIRONMENT" --context environment="$ENVIRONMENT" --quiet || echo "CDK synthesis completed with warnings (expected)"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          CDK_ENVIRONMENT: ${{ needs.determine-jobs.outputs.environment }}
          AWS_PIPELINE_ACCOUNT_ID: "123456789012" # Dummy account ID for validation

  # ============================================================================
  # JOB 2: Validation & Setup (With Deployment Permissions)
  # ============================================================================
  validate-setup:
    name: Validate & Setup
    needs: [determine-jobs]
    runs-on: ubuntu-latest
    if: needs.determine-jobs.outputs.run_validate_setup == 'true'
    environment: ${{ needs.determine-jobs.outputs.environment }}
    outputs:
      pipeline_account_id: ${{ steps.setup.outputs.pipeline_account_id }}
      dev_vpc_id: ${{ steps.dev-info.outputs.vpc_id || 'NOT_FOUND' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Environment Variables
        id: setup
        run: |
          echo "Setting up pipeline environment variables..."
          echo ""

          # Get current account ID with error handling
          echo "Retrieving AWS account information..."
          if ! CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>&1); then
            echo "CRITICAL ERROR: Cannot retrieve AWS account information"
            echo "AWS CLI Error: $CURRENT_ACCOUNT"
            exit 1
          fi

          # Validate account ID format
          if ! [[ "$CURRENT_ACCOUNT" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: Retrieved account ID has invalid format: '$CURRENT_ACCOUNT'"
            exit 1
          fi

          # Set outputs and environment variables
          echo "pipeline_account_id=$CURRENT_ACCOUNT" >> $GITHUB_OUTPUT
          echo "AWS_PIPELINE_ACCOUNT_ID=$CURRENT_ACCOUNT" >> $GITHUB_ENV

          echo "Successfully retrieved pipeline account information"
          echo "Account ID: ***${CURRENT_ACCOUNT: -4} (last 4 digits)"
          echo "Region: ${{ env.AWS_REGION }}"
          echo ""

      - name: Get Dev Account VPC Info
        id: dev-info
        run: |
          echo "Checking development account VPC configuration..."
          echo ""

          if [ "${{ vars.AWS_ACCOUNT_ID_DEV }}" != "" ]; then
            DEV_ACCOUNT_ID="${{ vars.AWS_ACCOUNT_ID_DEV }}"
            echo "Dev account configured: ***${DEV_ACCOUNT_ID: -4}"
            
            # Validate dev account ID format
            if ! [[ "$DEV_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
              echo "WARNING: Invalid dev account ID format"
              echo "vpc_id=NOT_FOUND" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Attempt role assumption
            ROLE_ARN="arn:aws:iam::$DEV_ACCOUNT_ID:role/GitHubDeploymentRole"
            echo "Assuming role: $ROLE_ARN"
            
            if ASSUME_ROLE_OUTPUT=$(aws sts assume-role \
              --role-arn "$ROLE_ARN" \
              --role-session-name "GetVpcInfo-$(date +%s)" \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text 2>&1); then
              
              echo "Successfully assumed cross-account role"
              read access_key secret_key session_token <<< "$ASSUME_ROLE_OUTPUT"
              
              if [ -z "$access_key" ] || [ -z "$secret_key" ] || [ -z "$session_token" ]; then
                echo "WARNING: Invalid credentials received"
                echo "vpc_id=NOT_FOUND" >> $GITHUB_OUTPUT
                exit 0
              fi
              
              # Query VPC info
              echo "Querying development VPCs..."
              if DEV_VPC=$(AWS_ACCESS_KEY_ID="$access_key" \
                          AWS_SECRET_ACCESS_KEY="$secret_key" \
                          AWS_SESSION_TOKEN="$session_token" \
                          aws ec2 describe-vpcs \
                            --filters "Name=tag:Environment,Values=development" \
                            --query 'Vpcs[0].VpcId' \
                            --output text 2>&1); then
                
                if [ "$DEV_VPC" != "None" ] && [ "$DEV_VPC" != "null" ] && [ -n "$DEV_VPC" ]; then
                  echo "Found development VPC: ***${DEV_VPC: -8}"
                  echo "vpc_id=$DEV_VPC" >> $GITHUB_OUTPUT
                else
                  echo "No development VPC found"
                  echo "vpc_id=NOT_FOUND" >> $GITHUB_OUTPUT
                fi
              else
                echo "WARNING: Cannot describe VPCs in development account"
                echo "vpc_id=NOT_FOUND" >> $GITHUB_OUTPUT
              fi
              
            else
              echo "WARNING: Cannot assume role in development account"
              echo "vpc_id=NOT_FOUND" >> $GITHUB_OUTPUT
            fi
            
          else
            echo "No development account configured"
            echo "vpc_id=NOT_FOUND" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB 3: Deploy Networking Stack
  # ============================================================================
  deploy-networking:
    name: Deploy Networking Stack
    needs: [determine-jobs, build, validate-setup]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-jobs.outputs.environment }}
    if: |
      always() &&
      needs.determine-jobs.outputs.run_deploy_networking == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.validate-setup.result == 'success' || needs.validate-setup.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Build Job Status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "ERROR: Build job did not succeed: ${{ needs.build.result }}"
            exit 1
          fi

          if [ -z "${{ needs.build.outputs.cache-key }}" ]; then
            echo "ERROR: Build cache key is empty"
            exit 1
          fi

          echo "Build job verification passed"

      - name: Verify Validate-Setup Job Outputs
        run: |
          if [ -z "${{ needs.validate-setup.outputs.pipeline_account_id }}" ]; then
            echo "CRITICAL: Pipeline Account ID is empty"
            exit 1
          fi
          echo "Validate-setup job verification passed"

      - name: Setup CDK Deployment Environment
        uses: ./.github/actions/setup-cdk-deployment
        with:
          node-version: ${{ env.NODE_VERSION }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          build-cache-key: ${{ needs.build.outputs.cache-key }}

      - name: Handle Export Dependencies
        shell: bash
        run: |
          ENVIRONMENT="${{ needs.determine-jobs.outputs.environment }}"
          
          echo "Checking for CloudFormation export dependencies..."
          echo "Environment: $ENVIRONMENT"
          echo ""

          STACK_NAME="NetworkingStack-$ENVIRONMENT"
          STACK_EXISTS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackName' \
            --output text 2>/dev/null || echo "")

          if [ -n "$STACK_EXISTS" ]; then
            echo "NetworkingStack exists, checking for export dependencies..."
            
            EXPORTS=$(aws cloudformation list-exports \
              --query "Exports[?starts_with(Name, '${STACK_NAME}')].Name" \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$EXPORTS" ]; then
              echo "Found exports that may be in use"
              echo "$EXPORTS" | tr '\t' '\n' | sed 's/^/  - /'
              echo ""
              
              # Update dependent stacks first if they exist
              EBS_STORAGE_STACK="EbsStorageStack-$ENVIRONMENT"
              EBS_STORAGE_EXISTS=$(aws cloudformation describe-stacks \
                --stack-name "$EBS_STORAGE_STACK" \
                --query 'Stacks[0].StackName' \
                --output text 2>/dev/null || echo "")
              
              if [ -n "$EBS_STORAGE_EXISTS" ]; then
                echo "Updating EbsStorageStack first to handle export changes..."
                CDK_ENVIRONMENT="$ENVIRONMENT" yarn cdk deploy "$EBS_STORAGE_STACK" --context environment="$ENVIRONMENT" --require-approval never 2>&1 || echo "EbsStorageStack update completed"
              fi
              
              ECS_STACK="EcsStack-$ENVIRONMENT"
              ECS_EXISTS=$(aws cloudformation describe-stacks \
                --stack-name "$ECS_STACK" \
                --query 'Stacks[0].StackName' \
                --output text 2>/dev/null || echo "")
              
              if [ -n "$ECS_EXISTS" ]; then
                echo "Updating EcsStack first to handle export changes..."
                CDK_ENVIRONMENT="$ENVIRONMENT" yarn cdk deploy "$ECS_STACK" --context environment="$ENVIRONMENT" --require-approval never 2>&1 || echo "EcsStack update completed"
              fi
              
              echo "Dependent stacks updated (if needed)"
            fi
          fi

      - name: Deploy NetworkingStack
        uses: ./.github/actions/deploy-cdk-stack
        with:
          stack-name: "NetworkingStack-${{ needs.determine-jobs.outputs.environment }}"
          environment: ${{ needs.determine-jobs.outputs.environment }}
          aws-account-id: ${{ needs.validate-setup.outputs.pipeline_account_id }}
          aws-region: ${{ env.AWS_REGION }}
          dev-vpc-id: ${{ needs.validate-setup.outputs.dev_vpc_id }}
          dev-account-id: ${{ vars.AWS_ACCOUNT_ID_DEV }}

            # ============================================================================
  # ============================================================================
  # JOB 4: Deploy EBS Storage Stack
  # ============================================================================
  deploy-ebs-storage:
    name: Deploy EBS Storage
    needs: [determine-jobs, build, validate-setup, deploy-networking]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-jobs.outputs.environment }}
    if: |
      always() &&
      needs.determine-jobs.outputs.run_deploy_ebs_storage == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.validate-setup.result == 'success' || needs.validate-setup.result == 'skipped') &&
      (needs.deploy-networking.result == 'success' || needs.deploy-networking.result == 'skipped') &&
      (github.event.inputs.stack == 'ebs-storage' || github.event_name == 'push' || github.event.inputs.jobs_to_run != '')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CDK Deployment Environment
        uses: ./.github/actions/setup-cdk-deployment
        with:
          node-version: ${{ env.NODE_VERSION }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          build-cache-key: ${{ needs.build.outputs.cache-key }}

      - name: Deploy EbsStorageStack
        uses: ./.github/actions/deploy-cdk-stack
        with:
          stack-name: "EbsStorageStack-${{ needs.determine-jobs.outputs.environment }}"
          environment: ${{ needs.determine-jobs.outputs.environment }}
          aws-account-id: ${{ needs.validate-setup.outputs.pipeline_account_id }}
          aws-region: ${{ env.AWS_REGION }}
          dev-vpc-id: ${{ needs.validate-setup.outputs.dev_vpc_id }}
          dev-account-id: ${{ vars.AWS_ACCOUNT_ID_DEV }}

      - name: Validate SSM Parameters
        run: |
          ENVIRONMENT="${{ needs.determine-jobs.outputs.environment }}"
          echo "Validating SSM parameters created by EbsStorageStack..."
          
          # Check for Prometheus config parameter
          PROMETHEUS_CONFIG=$(aws ssm get-parameter \
            --name "/monitoring/$ENVIRONMENT/prometheus-config" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$PROMETHEUS_CONFIG" ]; then
            echo "✓ Prometheus config parameter exists"
          else
            echo "WARNING: Prometheus config parameter not found"
          fi
          
          # Check for Grafana datasource config parameter
          GRAFANA_DATASOURCE=$(aws ssm get-parameter \
            --name "/monitoring/$ENVIRONMENT/grafana-datasource-config" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$GRAFANA_DATASOURCE" ]; then
            echo "✓ Grafana datasource config parameter exists"
          else
            echo "WARNING: Grafana datasource config parameter not found"
          fi
          
          # Check for EBS volume configuration parameters
          PROMETHEUS_VOLUME_SIZE=$(aws ssm get-parameter \
            --name "/monitoring/$ENVIRONMENT/ebs/prometheus-volume-size" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$PROMETHEUS_VOLUME_SIZE" ]; then
            echo "✓ Prometheus volume size parameter: ${PROMETHEUS_VOLUME_SIZE}GB"
          else
            echo "WARNING: Prometheus volume size parameter not found"
          fi
          
          echo "SUCCESS: EBS Storage Stack deployment validated"

  # ============================================================================
  # ============================================================================
  # JOB 5: Deploy ECS Stack
  # ============================================================================
  deploy-ecs:
    name: Deploy ECS
    needs: [determine-jobs, build, validate-setup, deploy-networking, deploy-ebs-storage]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-jobs.outputs.environment }}
    if: |
      always() &&
      needs.determine-jobs.outputs.run_deploy_ecs == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.validate-setup.result == 'success' || needs.validate-setup.result == 'skipped') &&
      (needs.deploy-networking.result == 'success' || needs.deploy-networking.result == 'skipped') &&
      (needs.deploy-ebs-storage.result == 'success' || needs.deploy-ebs-storage.result == 'skipped') &&
      (github.event.inputs.stack == 'ecs' || github.event_name == 'push' || github.event.inputs.jobs_to_run != '')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CDK Deployment Environment
        uses: ./.github/actions/setup-cdk-deployment
        with:
          node-version: ${{ env.NODE_VERSION }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          build-cache-key: ${{ needs.build.outputs.cache-key }}

      - name: Deploy EcsStack
        uses: ./.github/actions/deploy-cdk-stack
        with:
          stack-name: "EcsStack-${{ needs.determine-jobs.outputs.environment }}"
          environment: ${{ needs.determine-jobs.outputs.environment }}
          aws-account-id: ${{ needs.validate-setup.outputs.pipeline_account_id }}
          aws-region: ${{ env.AWS_REGION }}
          dev-vpc-id: ${{ needs.validate-setup.outputs.dev_vpc_id }}
          dev-account-id: ${{ vars.AWS_ACCOUNT_ID_DEV }}

