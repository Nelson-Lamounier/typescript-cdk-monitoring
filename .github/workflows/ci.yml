# @format

# .github/workflows/ci.yml
name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  NODE_VERSION: "22"

permissions:
  contents: write

jobs:
  # ============================================================================
  # Dependency Installation & Caching (Required by all other jobs)
  # ============================================================================
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.setup-node.outputs.cache-key }}
      node-version: ${{ env.NODE_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        id: setup-node
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}

  # ============================================================================
  # Code Quality Jobs (Run in Parallel - Non-blocking)
  # ============================================================================
  lint:
    name: Lint Code
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run ESLint
        run: make lint-ci

  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run TypeScript Compiler
        run: make typecheck

  # ============================================================================
  # Test Jobs (Run in Parallel for Faster Execution)
  # ============================================================================
  test-unit:
    name: Test Unit
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[ci skip]'))
    env:
      CDK_DOCKER_VERBOSE: "false"
      CDK_DEBUG: "false"
      CDK_ASSET_VERBOSE: "false"
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "quiet"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run Unit Tests
        run: make test-unit

      - name: Upload Unit Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-constructs:
    name: Test Constructs
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[ci skip]'))
    env:
      CDK_DOCKER_VERBOSE: "false"
      CDK_DEBUG: "false"
      CDK_ASSET_VERBOSE: "false"
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "quiet"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run Construct Tests
        run: make test-constructs

      - name: Upload Construct Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-constructs
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-stacks:
    name: Test Stacks
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[ci skip]'))
    env:
      CDK_DOCKER_VERBOSE: "false"
      CDK_DEBUG: "false"
      CDK_ASSET_VERBOSE: "false"
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "quiet"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run Stack Tests
        run: make test-stacks

      - name: Upload Stack Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-stacks
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-helpers:
    name: Test Helpers
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[ci skip]'))
    env:
      CDK_DOCKER_VERBOSE: "false"
      CDK_DEBUG: "false"
      CDK_ASSET_VERBOSE: "false"
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "quiet"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run Helper Tests
        run: make test-helpers

      - name: Upload Helper Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-helpers
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  test-security:
    name: Test Security
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[ci skip]'))
    env:
      CDK_DOCKER_VERBOSE: "false"
      CDK_DEBUG: "false"
      CDK_ASSET_VERBOSE: "false"
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "quiet"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run Security Tests
        run: make test-security

  test-connectivity:
    name: Test Connectivity
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[ci skip]'))
    env:
      CDK_DOCKER_VERBOSE: "false"
      CDK_DEBUG: "false"
      CDK_ASSET_VERBOSE: "false"
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "quiet"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Run Connectivity Tests
        run: make test-connectivity

  test-snapshots:
    name: Test Snapshots
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, '[skip ci]') && 
       !contains(github.event.head_commit.message, '[ci skip]'))
    env:
      CDK_DOCKER_VERBOSE: "false"
      CDK_DEBUG: "false"
      CDK_ASSET_VERBOSE: "false"
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "quiet"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Update Test Snapshots
        run: make test-update-snapshots

      - name: Check for Snapshot Changes
        id: snapshots
        run: |
          if [ -n "$(git status --porcelain tests/unit/**/__snapshots__/*.snap 2>/dev/null)" ]; then
            echo "Snapshots were updated. Changes:"
            git diff --stat tests/unit/**/__snapshots__/*.snap || true
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No snapshot changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit Updated Snapshots
        if: steps.snapshots.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Committing updated snapshots..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tests/unit/**/__snapshots__/*.snap
          git commit -m "chore(ci): update test snapshots [skip ci]" || echo "Commit failed"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
            git push origin HEAD:${{ github.ref_name }} || echo "Push failed - may need manual intervention"
          else
            echo "Skipping push on branch ${{ github.ref }}"
            echo "Snapshots updated but not pushed. Please commit manually or merge to main."
          fi

      - name: Run Snapshot Tests
        run: make test-coverage

      - name: Upload Snapshot Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-snapshots
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # Build Job (Can Run in Parallel with Tests)
  # ============================================================================
  build:
    name: Build TypeScript
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Build TypeScript
        run: make build

  # ============================================================================
  # CDK Validation (Depends on Build)
  # ============================================================================
  validate-cdk:
    name: Validate CDK Stacks
    needs: [setup, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Synthesize CDK Stacks
        run: |
          echo "Listing CDK stacks..."
          npx cdk list --all
          echo "Synthesizing CDK stacks..."
          npx cdk synth --all --quiet
        env:
          AWS_REGION: eu-west-1

      - name: Upload CDK Synthesis
        uses: actions/upload-artifact@v4
        with:
          name: cdk-synthesis
          path: cdk.out/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # Coverage Aggregation & Publishing (Runs After All Tests)
  # ============================================================================
  coverage-summary:
    name: Coverage Summary & Report
    needs: [test-unit, test-constructs, test-stacks, test-helpers, test-security, test-connectivity, test-snapshots]
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download All Coverage Reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage/

      - name: Generate Comprehensive Coverage Report
        id: coverage-report
        run: |
          echo "Generating comprehensive coverage report..."
          
          # Run tests with coverage to consolidate all reports
          yarn test --coverage --silent || true
          
          # Check if coverage files exist
          if [ ! -f "coverage/index.html" ]; then
            echo "Coverage HTML report not found. Generating fresh coverage..."
            yarn test:coverage
          fi
          
          echo "coverage_generated=true" >> $GITHUB_OUTPUT
          
          # Extract coverage metrics
          if [ -f "coverage/coverage-summary.json" ]; then
            STATEMENTS=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
            BRANCHES=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
            FUNCTIONS=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)
            LINES=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
            
            echo "statements_pct=$STATEMENTS" >> $GITHUB_OUTPUT
            echo "branches_pct=$BRANCHES" >> $GITHUB_OUTPUT
            echo "functions_pct=$FUNCTIONS" >> $GITHUB_OUTPUT
            echo "lines_pct=$LINES" >> $GITHUB_OUTPUT
            
            echo "Coverage Metrics:"
            echo "  Statements: ${STATEMENTS}%"
            echo "  Branches: ${BRANCHES}%"
            echo "  Functions: ${FUNCTIONS}%"
            echo "  Lines: ${LINES}%"
          else
            echo "Coverage summary not found"
            echo "statements_pct=0" >> $GITHUB_OUTPUT
            echo "branches_pct=0" >> $GITHUB_OUTPUT
            echo "functions_pct=0" >> $GITHUB_OUTPUT
            echo "lines_pct=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate Coverage Badge Data
        if: steps.coverage-report.outputs.coverage_generated == 'true'
        run: |
          LINES_PCT="${{ steps.coverage-report.outputs.lines_pct }}"
          
          # Determine badge colour based on coverage
          if (( $(echo "$LINES_PCT >= 80" | bc -l) )); then
            BADGE_COLOR="brightgreen"
          elif (( $(echo "$LINES_PCT >= 70" | bc -l) )); then
            BADGE_COLOR="green"
          elif (( $(echo "$LINES_PCT >= 60" | bc -l) )); then
            BADGE_COLOR="yellow"
          elif (( $(echo "$LINES_PCT >= 50" | bc -l) )); then
            BADGE_COLOR="orange"
          else
            BADGE_COLOR="red"
          fi
          
          echo "Badge colour: $BADGE_COLOR (${LINES_PCT}%)"
          echo "BADGE_COLOR=$BADGE_COLOR" >> $GITHUB_ENV
          echo "LINES_PCT=$LINES_PCT" >> $GITHUB_ENV

      - name: Upload Combined Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

      - name: Generate Coverage Summary for PR/Commit
        if: steps.coverage-report.outputs.coverage_generated == 'true'
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Test Coverage Report
          
          ### Coverage Metrics
          
          | Metric | Coverage | Status |
          |--------|----------|--------|
          | **Statements** | ${{ steps.coverage-report.outputs.statements_pct }}% | $([ $(echo "${{ steps.coverage-report.outputs.statements_pct }} >= 70" | bc -l) -eq 1 ] && echo "✅" || echo "⚠️") |
          | **Branches** | ${{ steps.coverage-report.outputs.branches_pct }}% | $([ $(echo "${{ steps.coverage-report.outputs.branches_pct }} >= 70" | bc -l) -eq 1 ] && echo "✅" || echo "⚠️") |
          | **Functions** | ${{ steps.coverage-report.outputs.functions_pct }}% | $([ $(echo "${{ steps.coverage-report.outputs.functions_pct }} >= 70" | bc -l) -eq 1 ] && echo "✅" || echo "⚠️") |
          | **Lines** | ${{ steps.coverage-report.outputs.lines_pct }}% | $([ $(echo "${{ steps.coverage-report.outputs.lines_pct }} >= 70" | bc -l) -eq 1 ] && echo "✅" || echo "⚠️") |
          
          ### Coverage Thresholds
          
          - 🎯 **Target**: 70% minimum coverage
          - ✅ **Pass**: ≥70%
          - ⚠️ **Warning**: 50-69%
          - ❌ **Fail**: <50%
          
          ### HTML Coverage Report
          
          📊 **Interactive Coverage Report**: Download the \`coverage-report-html\` artifact from this workflow run to view the detailed HTML report.
          
          To view locally:
          1. Download the \`coverage-report-html\` artifact
          2. Extract the archive
          3. Open \`index.html\` in your browser
          
          ### Coverage by Module
          
          EOF
          
          # Add top uncovered files
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "#### Files Needing Attention (Lowest Coverage)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            jq -r '
              to_entries | 
              map(select(.key != "total")) | 
              sort_by(.value.lines.pct) | 
              limit(10; .[]) | 
              "| \(.key | split("/") | .[-1]) | \(.value.lines.pct)% | \(.value.lines.covered)/\(.value.lines.total) |"
            ' coverage/coverage-summary.json | sed '1i| File | Coverage | Lines |' | sed '2i|------|----------|-------|' >> $GITHUB_STEP_SUMMARY
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          
          ### Quick Actions
          
          - **Run locally**: \`make test-coverage\`
          - **View report**: \`open coverage/index.html\`
          - **Update snapshots**: \`make test-update-snapshots\`
          
          EOF

      - name: Check Coverage Thresholds
        if: steps.coverage-report.outputs.coverage_generated == 'true'
        run: |
          LINES_PCT="${{ steps.coverage-report.outputs.lines_pct }}"
          BRANCHES_PCT="${{ steps.coverage-report.outputs.branches_pct }}"
          FUNCTIONS_PCT="${{ steps.coverage-report.outputs.functions_pct }}"
          STATEMENTS_PCT="${{ steps.coverage-report.outputs.statements_pct }}"
          
          echo "Checking coverage thresholds..."
          echo "  Lines: ${LINES_PCT}% (minimum: 50%)"
          echo "  Branches: ${BRANCHES_PCT}% (minimum: 50%)"
          echo "  Functions: ${FUNCTIONS_PCT}% (minimum: 50%)"
          echo "  Statements: ${STATEMENTS_PCT}% (minimum: 50%)"
          
          THRESHOLD_FAILED=false
          
          # Minimum thresholds (non-blocking, warning only)
          if (( $(echo "$LINES_PCT < 50" | bc -l) )); then
            echo "::warning::Lines coverage (${LINES_PCT}%) is below 50% threshold"
            THRESHOLD_FAILED=true
          fi
          
          if (( $(echo "$BRANCHES_PCT < 50" | bc -l) )); then
            echo "::warning::Branches coverage (${BRANCHES_PCT}%) is below 50% threshold"
            THRESHOLD_FAILED=true
          fi
          
          if (( $(echo "$FUNCTIONS_PCT < 50" | bc -l) )); then
            echo "::warning::Functions coverage (${FUNCTIONS_PCT}%) is below 50% threshold"
            THRESHOLD_FAILED=true
          fi
          
          if (( $(echo "$STATEMENTS_PCT < 50" | bc -l) )); then
            echo "::warning::Statements coverage (${STATEMENTS_PCT}%) is below 50% threshold"
            THRESHOLD_FAILED=true
          fi
          
          if [ "$THRESHOLD_FAILED" = true ]; then
            echo ""
            echo "::warning::Coverage is below recommended thresholds. Consider adding more tests."
            echo "This is a warning only - CI will not fail."
          else
            echo ""
            echo "✅ All coverage thresholds met!"
          fi

  # ============================================================================
  # Summary Job (Shows Overall Status)
  # ============================================================================
  ci-success:
    name: CI Complete
    needs:
      [
        lint,
        typecheck,
        test-unit,
        test-constructs,
        test-stacks,
        test-helpers,
        test-security,
        test-connectivity,
        test-snapshots,
        build,
        validate-cdk,
      ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check All Jobs Passed
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Check: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Construct Tests: ${{ needs.test-constructs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stack Tests: ${{ needs.test-stacks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Helper Tests: ${{ needs.test-helpers.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Tests: ${{ needs.test-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Connectivity Tests: ${{ needs.test-connectivity.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Snapshot Tests: ${{ needs.test-snapshots.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build & Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CDK Validation: ${{ needs.validate-cdk.result }}" >> $GITHUB_STEP_SUMMARY

          CRITICAL_FAILED=false
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build failed" >> $GITHUB_STEP_SUMMARY
            CRITICAL_FAILED=true
          fi
          if [[ "${{ needs.validate-cdk.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CDK Validation failed" >> $GITHUB_STEP_SUMMARY
            CRITICAL_FAILED=true
          fi

          if [[ "$CRITICAL_FAILED" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CI pipeline failed due to critical job failures" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          NON_CRITICAL_FAILED=false
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.test-unit.result }}" == "failure" ]] || \
             [[ "${{ needs.test-constructs.result }}" == "failure" ]] || \
             [[ "${{ needs.test-stacks.result }}" == "failure" ]] || \
             [[ "${{ needs.test-helpers.result }}" == "failure" ]] || \
             [[ "${{ needs.test-security.result }}" == "failure" ]] || \
             [[ "${{ needs.test-connectivity.result }}" == "failure" ]] || \
             [[ "${{ needs.test-snapshots.result }}" == "failure" ]]; then
            NON_CRITICAL_FAILED=true
          fi

          if [[ "$NON_CRITICAL_FAILED" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some non-critical checks failed (see individual job results)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All critical CI checks passed" >> $GITHUB_STEP_SUMMARY
