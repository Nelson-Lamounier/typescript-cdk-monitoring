# @format

# .github/workflows/ci.yml
name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  # ============================================================================
  # Dependency Installation (Required by all other jobs)
  # ============================================================================
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Dependency Cache Key
        id: cache-key
        run: |
          # Hash yarn.lock and package.json for cache key
          HASH=$(cat yarn.lock package.json | sha256sum | cut -d' ' -f1)
          echo "key=deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-$HASH" >> $GITHUB_OUTPUT

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

  # ============================================================================
  # Code Quality Jobs (Run in Parallel)
  # ============================================================================
  lint:
    name: Lint Code
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ESLint
        run: |
          echo "Running ESLint..."
          npx eslint lib/ bin/ tests/ --max-warnings 0

      - name: Check Formatting
        run: |
          echo "Checking code formatting..."
          yarn format:check

  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run TypeScript Compiler
        run: |
          echo "Running TypeScript type checking..."
          yarn typecheck

  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Tests with Coverage
        run: |
          echo "Running tests..."
          yarn test:ci
        env:
          CDK_DOCKER_VERBOSE: "false"
          CDK_DEBUG: "false"
          CDK_ASSET_VERBOSE: "false"

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Coverage Summary
        if: always()
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              console.log(\`- **Lines**: \${total.lines.pct}%\`);
              console.log(\`- **Functions**: \${total.functions.pct}%\`);
              console.log(\`- **Branches**: \${total.branches.pct}%\`);
              console.log(\`- **Statements**: \${total.statements.pct}%\`);
            " >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Build Job
  # ============================================================================
  build:
    name: Build TypeScript
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      build-cache-key: ${{ steps.build-cache.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Build Cache Key
        id: build-cache
        run: |
          # Hash source files for build cache
          HASH=$(find lib bin -type f \( -name "*.ts" -o -name "*.js" \) -exec sha256sum {} + | sha256sum | cut -d' ' -f1)
          echo "key=build-${{ runner.os }}-$HASH" >> $GITHUB_OUTPUT

      - name: Cache Build Output
        uses: actions/cache@v4
        with:
          path: |
            dist
            .turbo
          key: ${{ steps.build-cache.outputs.key }}
          restore-keys: build-${{ runner.os }}-

      - name: Build TypeScript
        run: |
          echo "Building TypeScript..."
          yarn build

          # Verify build output
          if [ -d "dist" ] && [ "$(find dist -name '*.js' | wc -l)" -gt 0 ]; then
            echo "Build successful"
          else
            echo "No JS files generated (may use ts-node)"
          fi

  # ============================================================================
  # CDK Validation (Depends on Build)
  # ============================================================================
  validate-cdk:
    name: Validate CDK Stacks
    needs: [setup, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Infrastructure
        uses: ./.github/actions/setup-infrastructure
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: |
            dist
            .turbo
          key: ${{ needs.build.outputs.build-cache-key }}
          restore-keys: build-${{ runner.os }}-

      - name: List Available Stacks
        run: |
          echo "Listing CDK stacks..."
          CDK_ENVIRONMENT=pipeline npx cdk list --context environment=pipeline
        env:
          AWS_REGION: eu-west-1

      - name: Synthesize CDK Stacks
        run: |
          echo "Synthesizing CDK stacks..."
          CDK_ENVIRONMENT=pipeline npx cdk synth --context environment=pipeline --quiet

          echo "CDK synthesis successful"
        env:
          AWS_REGION: eu-west-1
          CDK_ENVIRONMENT: pipeline

      - name: Upload CDK Outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: cdk.out/
          retention-days: 7

  # ============================================================================
  # Summary Job (Optional - Shows Overall Status)
  # ============================================================================
  ci-success:
    name: CI Complete
    needs: [lint, typecheck, test, build, validate-cdk]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check All Jobs Passed
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Check: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CDK Validation: ${{ needs.validate-cdk.result }}" >> $GITHUB_STEP_SUMMARY

          # Fail if any job failed
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CI pipeline failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All CI checks passed" >> $GITHUB_STEP_SUMMARY
