# @format

name: "Setup Infrastructure Environment"
description: "Sets up Node.js, Corepack, dependencies, and caching for infrastructure deployment"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  cache-key:
    description: "Cache key for build artifacts"
    required: false
    default: ""

outputs:
  cache-hit:
    description: "Whether cache was hit"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable Corepack
      shell: bash
      run: corepack enable
      # Corepack enables Yarn v4+ package manager without global installation

    - name: Setup Turbo Cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Cache Dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          .yarn/cache
          .yarn/unplugged
          .yarn/install-state.gz
          .pnp.cjs
          .pnp.loader.mjs
          node_modules
          infrastructure/node_modules
        # Cache key based on lockfile hash - invalidates when dependencies change
        key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Install Dependencies
      shell: bash
      run: |
        # Always run install to guarantee binaries (like CDK) exist.
        # With Yarn v4 this is fast when cache is warm, and fixes "command not found: cdk".
        # --immutable ensures lockfile consistency and prevents accidental dependency changes
        yarn install --immutable
