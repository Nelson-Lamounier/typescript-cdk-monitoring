# @format

name: "Infrastructure Drift Detection"
description: "Detects drift between deployed infrastructure and CDK configuration"

inputs:
  stack-name:
    description: "Name of the CDK stack to check for drift"
    required: true
  environment:
    description: "Environment name (e.g., pipeline, development, production)"
    required: true
  aws-account-id:
    description: "AWS Account ID for deployment"
    required: true
  aws-region:
    description: "AWS Region for deployment"
    required: true
  dev-vpc-id:
    description: "Development VPC ID (optional)"
    required: false
    default: ""
  dev-account-id:
    description: "Development Account ID (optional)"
    required: false
    default: ""
  drift-threshold:
    description: "Maximum number of drifted resources before failing (0 = fail on any drift)"
    required: false
    default: "0"
  check-mode:
    description: "Drift check mode: 'full' (CloudFormation + CDK diff) or 'quick' (CDK diff only)"
    required: false
    default: "full"

outputs:
  drift-detected:
    description: "Whether drift was detected (true/false)"
    value: ${{ steps.analyze.outputs.drift-detected }}
  drift-count:
    description: "Number of resources with detected drift"
    value: ${{ steps.analyze.outputs.drift-count }}
  drift-severity:
    description: "Severity of drift: none, low, medium, high, critical"
    value: ${{ steps.analyze.outputs.drift-severity }}

runs:
  using: "composite"
  steps:
    - name: Validate Drift Detection Inputs
      shell: bash
      run: |
        echo "Validating drift detection parameters..."
        echo ""

        VALIDATION_ERRORS=0

        # Validate required inputs - ensures all mandatory parameters are present before proceeding
        if [ -z "${{ inputs.stack-name }}" ]; then
          echo "CRITICAL ERROR: Stack name is required"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        if [ -z "${{ inputs.environment }}" ]; then
          echo "CRITICAL ERROR: Environment is required"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        if [ -z "${{ inputs.aws-account-id }}" ]; then
          echo "CRITICAL ERROR: AWS Account ID is required"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        # Validate drift threshold - must be numeric to allow configurable failure tolerance
        if ! [[ "${{ inputs.drift-threshold }}" =~ ^[0-9]+$ ]]; then
          echo "CRITICAL ERROR: Drift threshold must be a non-negative integer"
          echo "Provided: '${{ inputs.drift-threshold }}'"
          echo "Expected: 0, 1, 2, etc."
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        # Validate check mode - supports both CloudFormation drift (full) and CDK diff only (quick)
        if [[ "${{ inputs.check-mode }}" != "full" && "${{ inputs.check-mode }}" != "quick" ]]; then
          echo "CRITICAL ERROR: Invalid check mode"
          echo "Provided: '${{ inputs.check-mode }}'"
          echo "Expected: 'full' or 'quick'"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi

        if [ $VALIDATION_ERRORS -gt 0 ]; then
          echo ""
          echo "DRIFT DETECTION BLOCKED: $VALIDATION_ERRORS validation error(s)"
          exit 1
        fi

        echo "Drift detection parameters validated"
        echo ""
        echo "Configuration:"
        echo "  Stack: ${{ inputs.stack-name }}"
        echo "  Environment: ${{ inputs.environment }}"
        echo "  Check Mode: ${{ inputs.check-mode }}"
        echo "  Drift Threshold: ${{ inputs.drift-threshold }}"
        echo "  Account: ***MASKED***"
        echo "  Region: ${{ inputs.aws-region }}"

    - name: Check Stack Existence
      shell: bash
      run: |
        echo "Verifying stack exists in AWS..."

        # Check if CloudFormation stack exists
        if aws cloudformation describe-stacks --stack-name "${{ inputs.stack-name }}" &>/dev/null; then
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack-name }}" \
            --query 'Stacks[0].StackStatus' \
            --output text)
          
          echo "Stack found: ${{ inputs.stack-name }}"
          echo "Status: $STACK_STATUS"
          
          # Check if stack is in a stable state - drift detection requires stable stack state
          # to avoid false positives from in-progress operations
          case "$STACK_STATUS" in
            "CREATE_COMPLETE"|"UPDATE_COMPLETE"|"IMPORT_COMPLETE")
              echo "Stack is in stable state for drift detection"
              ;;
            "CREATE_IN_PROGRESS"|"UPDATE_IN_PROGRESS"|"DELETE_IN_PROGRESS")
              echo "Stack is currently being modified"
              echo "Drift detection may not be accurate during stack operations"
              ;;
            "ROLLBACK_COMPLETE"|"UPDATE_ROLLBACK_COMPLETE")
              echo "Stack is in rollback state"
              echo "Consider resolving stack issues before drift detection"
              ;;
            *)
              echo "Stack is in unexpected state: $STACK_STATUS"
              echo "Drift detection may not work correctly"
              ;;
          esac
        else
          echo "STACK NOT FOUND"
          echo ""
          echo "ERROR: CloudFormation stack '${{ inputs.stack-name }}' does not exist"
          echo ""
          echo "POSSIBLE CAUSES:"
          echo "  1. Stack has never been deployed"
          echo "  2. Stack was deleted manually"
          echo "  3. Wrong stack name or environment suffix"
          echo "  4. Deploying to wrong AWS account/region"
          echo ""
          echo "TROUBLESHOOTING STEPS:"
          echo "  1. List available stacks: aws cloudformation list-stacks"
          echo "  2. Check stack name format: [StackName]-${{ inputs.environment }}"
          echo "  3. Verify AWS account and region"
          echo "  4. Deploy stack first if it doesn't exist"
          echo ""
          exit 1
        fi

    - name: CDK Diff Analysis
      id: cdk-diff
      shell: bash
      run: |
        echo "Performing CDK diff analysis..."
        echo ""

        # Set environment variables for CDK
        export ENVIRONMENT="${{ inputs.environment }}"
        export AWS_PIPELINE_ACCOUNT_ID="${{ inputs.aws-account-id }}"
        export AWS_REGION="${{ inputs.aws-region }}"

        # Set optional environment variables
        if [ -n "${{ inputs.dev-vpc-id }}" ]; then
          export DEV_VPC_ID="${{ inputs.dev-vpc-id }}"
        fi

        if [ -n "${{ inputs.dev-account-id }}" ]; then
          export AWS_ACCOUNT_ID_DEV="${{ inputs.dev-account-id }}"
        fi

        echo "Running CDK diff for ${{ inputs.stack-name }}..."

        # Capture CDK diff output - compares CDK code against deployed stack
        if CDK_DIFF_OUTPUT=$(npx cdk diff "${{ inputs.stack-name }}" 2>&1); then
          echo "CDK diff completed successfully"
          
          # Analyze diff output for changes - parses CDK diff to detect additions, deletions, modifications
          if echo "$CDK_DIFF_OUTPUT" | grep -q "There were no differences"; then
            echo "No differences detected in CDK diff"
            echo "cdk_drift_detected=false" >> $GITHUB_OUTPUT
            echo "cdk_changes_count=0" >> $GITHUB_OUTPUT
          else
            echo "CDK differences detected"
            
            # Count different types of changes - categorises drift by change type for better reporting
            ADDITIONS=$(echo "$CDK_DIFF_OUTPUT" | grep -c "^\[+\]" || echo "0")
            DELETIONS=$(echo "$CDK_DIFF_OUTPUT" | grep -c "^\[-\]" || echo "0")
            MODIFICATIONS=$(echo "$CDK_DIFF_OUTPUT" | grep -c "^\[~\]" || echo "0")
            TOTAL_CHANGES=$((ADDITIONS + DELETIONS + MODIFICATIONS))
            
            echo "CDK Diff Summary:"
            echo "  Additions: $ADDITIONS"
            echo "  Deletions: $DELETIONS"
            echo "  Modifications: $MODIFICATIONS"
            echo "  Total Changes: $TOTAL_CHANGES"
            
            echo "cdk_drift_detected=true" >> $GITHUB_OUTPUT
            echo "cdk_changes_count=$TOTAL_CHANGES" >> $GITHUB_OUTPUT
            echo "cdk_additions=$ADDITIONS" >> $GITHUB_OUTPUT
            echo "cdk_deletions=$DELETIONS" >> $GITHUB_OUTPUT
            echo "cdk_modifications=$MODIFICATIONS" >> $GITHUB_OUTPUT
            
            # Save diff output for analysis
            echo "$CDK_DIFF_OUTPUT" > cdk-diff-output.txt
            echo "CDK diff output saved to cdk-diff-output.txt"
          fi
        else
          echo "CDK diff failed"
          echo ""
          echo "ERROR: Cannot perform CDK diff"
          echo "CDK Error Output:"
          echo "$CDK_DIFF_OUTPUT" | head -20
          echo ""
          echo "POSSIBLE CAUSES:"
          echo "  1. CDK synthesis errors"
          echo "  2. Invalid environment configuration"
          echo "  3. Missing dependencies or permissions"
          echo "  4. Stack configuration issues"
          echo ""
          exit 1
        fi

    - name: CloudFormation Drift Detection
      id: cf-drift
      if: inputs.check-mode == 'full'
      shell: bash
      run: |
        echo "Performing CloudFormation drift detection..."
        echo ""

        # Start drift detection
        echo "Starting CloudFormation drift detection for ${{ inputs.stack-name }}..."

        if DRIFT_DETECTION_ID=$(aws cloudformation detect-stack-drift \
          --stack-name "${{ inputs.stack-name }}" \
          --query 'StackDriftDetectionId' \
          --output text 2>&1); then
          
          echo "Drift detection started"
          echo "Detection ID: $DRIFT_DETECTION_ID"
          echo "::add-mask::$DRIFT_DETECTION_ID"
          
          # Wait for drift detection to complete - CloudFormation drift detection is asynchronous
          # and requires polling to check completion status
          echo "Waiting for drift detection to complete..."
          MAX_WAIT=300  # 5 minutes timeout to prevent indefinite waiting
          WAIT_TIME=0
          
          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            DETECTION_STATUS=$(aws cloudformation describe-stack-drift-detection-status \
              --stack-drift-detection-id "$DRIFT_DETECTION_ID" \
              --query 'DetectionStatus' \
              --output text)
            
            case "$DETECTION_STATUS" in
              "DETECTION_COMPLETE")
                echo "Drift detection completed"
                break
                ;;
              "DETECTION_IN_PROGRESS")
                echo "Still detecting... (${WAIT_TIME}s elapsed)"
                sleep 10
                WAIT_TIME=$((WAIT_TIME + 10))
                ;;
              "DETECTION_FAILED")
                echo "Drift detection failed"
                FAILURE_REASON=$(aws cloudformation describe-stack-drift-detection-status \
                  --stack-drift-detection-id "$DRIFT_DETECTION_ID" \
                  --query 'StatusReason' \
                  --output text)
                echo "Failure Reason: $FAILURE_REASON"
                exit 1
                ;;
              *)
                echo "Unexpected detection status: $DETECTION_STATUS"
                ;;
            esac
          done
          
          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "Drift detection timed out after ${MAX_WAIT} seconds"
            echo "This may indicate a large stack or AWS service issues"
            exit 1
          fi
          
          # Get drift detection results
          echo "Retrieving drift detection results..."
          
          # Retrieve stack drift status with error checking
          # If this command fails, we cannot determine drift status and must fail the step
          if ! DRIFT_STATUS=$(aws cloudformation describe-stack-drift-detection-status \
            --stack-drift-detection-id "$DRIFT_DETECTION_ID" \
            --query 'StackDriftStatus' \
            --output text 2>&1); then
            echo "CRITICAL ERROR: Failed to retrieve stack drift status"
            echo ""
            echo "AWS CLI Error: $DRIFT_STATUS"
            echo ""
            echo "POSSIBLE CAUSES:"
            echo "  1. Network connectivity issues"
            echo "  2. AWS API throttling or rate limiting"
            echo "  3. Insufficient CloudFormation permissions"
            echo "  4. Invalid drift detection ID"
            echo "  5. AWS service temporarily unavailable"
            echo ""
            echo "REQUIRED PERMISSIONS:"
            echo "  - cloudformation:DescribeStackDriftDetectionStatus"
            echo ""
            echo "TROUBLESHOOTING:"
            echo "  1. Verify AWS credentials are valid"
            echo "  2. Check network connectivity to AWS"
            echo "  3. Retry the drift detection after a short delay"
            echo "  4. Verify IAM permissions include required CloudFormation actions"
            echo ""
            exit 1
          fi
          
          # Validate drift status is not empty - empty result indicates API failure
          if [ -z "$DRIFT_STATUS" ]; then
            echo "CRITICAL ERROR: Stack drift status is empty"
            echo ""
            echo "The AWS API returned an empty response, indicating the query failed silently"
            echo ""
            echo "POSSIBLE CAUSES:"
            echo "  1. Invalid query path or stack drift detection ID"
            echo "  2. AWS API returned unexpected response format"
            echo "  3. Stack drift detection was cancelled or expired"
            echo ""
            echo "TROUBLESHOOTING:"
            echo "  1. Verify drift detection ID is valid: $DRIFT_DETECTION_ID"
            echo "  2. Check CloudFormation console for drift detection status"
            echo "  3. Retry drift detection from the beginning"
            echo ""
            exit 1
          fi
          
          # Retrieve drifted resource count with error checking
          # If this command fails, we cannot determine drift count and must fail the step
          if ! DRIFTED_RESOURCES=$(aws cloudformation describe-stack-drift-detection-status \
            --stack-drift-detection-id "$DRIFT_DETECTION_ID" \
            --query 'DriftedStackResourceCount' \
            --output text 2>&1); then
            echo "CRITICAL ERROR: Failed to retrieve drifted resource count"
            echo ""
            echo "AWS CLI Error: $DRIFTED_RESOURCES"
            echo ""
            echo "POSSIBLE CAUSES:"
            echo "  1. Network connectivity issues"
            echo "  2. AWS API throttling or rate limiting"
            echo "  3. Insufficient CloudFormation permissions"
            echo "  4. Invalid drift detection ID"
            echo "  5. AWS service temporarily unavailable"
            echo ""
            echo "REQUIRED PERMISSIONS:"
            echo "  - cloudformation:DescribeStackDriftDetectionStatus"
            echo ""
            echo "TROUBLESHOOTING:"
            echo "  1. Verify AWS credentials are valid"
            echo "  2. Check network connectivity to AWS"
            echo "  3. Retry the drift detection after a short delay"
            echo "  4. Verify IAM permissions include required CloudFormation actions"
            echo ""
            exit 1
          fi
          
          # Validate drifted resources count is numeric - non-numeric values indicate API failure
          # Empty string or non-numeric values would cause incorrect arithmetic in analysis step
          if [ -z "$DRIFTED_RESOURCES" ] || ! [[ "$DRIFTED_RESOURCES" =~ ^[0-9]+$ ]]; then
            echo "CRITICAL ERROR: Invalid drifted resource count"
            echo ""
            echo "Expected: Non-negative integer (0, 1, 2, etc.)"
            echo "Received: '$DRIFTED_RESOURCES'"
            echo ""
            echo "POSSIBLE CAUSES:"
            echo "  1. AWS API returned unexpected response format"
            echo "  2. Query path returned wrong data type"
            echo "  3. Stack drift detection was cancelled or expired"
            echo ""
            echo "TROUBLESHOOTING:"
            echo "  1. Verify drift detection ID is valid: $DRIFT_DETECTION_ID"
            echo "  2. Check CloudFormation console for drift detection status"
            echo "  3. Retry drift detection from the beginning"
            echo ""
            exit 1
          fi
          
          echo "CloudFormation Drift Results:"
          echo "  Stack Drift Status: $DRIFT_STATUS"
          echo "  Drifted Resources: $DRIFTED_RESOURCES"
          
          # Only set outputs if all validations passed - ensures downstream steps receive valid data
          echo "cf_drift_status=$DRIFT_STATUS" >> $GITHUB_OUTPUT
          echo "cf_drifted_resources=$DRIFTED_RESOURCES" >> $GITHUB_OUTPUT
          
          # Get detailed drift information if drift detected - retrieves specific resource
          # property differences to aid troubleshooting
          if [ "$DRIFT_STATUS" = "DRIFTED" ] && [ "$DRIFTED_RESOURCES" -gt 0 ]; then
            echo ""
            echo "Getting detailed drift information..."
            
            # Get list of drifted resources - filters for MODIFIED and DELETED states only
            aws cloudformation describe-stack-resource-drifts \
              --stack-name "${{ inputs.stack-name }}" \
              --stack-resource-drift-status-filters "MODIFIED" "DELETED" \
              --query 'StackResourceDrifts[*].{ResourceType:ResourceType,LogicalId:LogicalResourceId,Status:StackResourceDriftStatus,PropertyDifferences:PropertyDifferences}' \
              --output table > cf-drift-details.txt
            
            echo "Detailed drift information saved to cf-drift-details.txt"
            
            # Show summary of drifted resources
            echo ""
            echo "DRIFTED RESOURCES SUMMARY:"
            aws cloudformation describe-stack-resource-drifts \
              --stack-name "${{ inputs.stack-name }}" \
              --stack-resource-drift-status-filters "MODIFIED" "DELETED" \
              --query 'StackResourceDrifts[*].{Type:ResourceType,LogicalId:LogicalResourceId,Status:StackResourceDriftStatus}' \
              --output table
          fi
          
        else
          echo "Failed to start CloudFormation drift detection"
          echo ""
          echo "ERROR: Cannot initiate drift detection"
          echo "AWS CLI Error: $DRIFT_DETECTION_ID"
          echo ""
          echo "POSSIBLE CAUSES:"
          echo "  1. Insufficient CloudFormation permissions"
          echo "  2. Stack is in unstable state"
          echo "  3. AWS service temporarily unavailable"
          echo "  4. Stack does not support drift detection"
          echo ""
          echo "REQUIRED PERMISSIONS:"
          echo "  - cloudformation:DetectStackDrift"
          echo "  - cloudformation:DescribeStackDriftDetectionStatus"
          echo "  - cloudformation:DescribeStackResourceDrifts"
          echo ""
          exit 1
        fi

    - name: Analyze Drift Results
      id: analyze
      shell: bash
      run: |
        echo "Analyzing drift detection results..."
        echo ""

        # Initialize variables
        DRIFT_DETECTED=false
        TOTAL_DRIFT_COUNT=0
        DRIFT_SEVERITY="none"

        # Get CDK diff results
        CDK_DRIFT="${{ steps.cdk-diff.outputs.cdk_drift_detected }}"
        CDK_CHANGES="${{ steps.cdk-diff.outputs.cdk_changes_count }}"

        echo "Analysis Summary:"
        echo "  CDK Drift Detected: $CDK_DRIFT"
        echo "  CDK Changes Count: $CDK_CHANGES"

        # Get CloudFormation results if full check was performed - combines CDK diff and
        # CloudFormation drift detection for comprehensive analysis
        if [ "${{ inputs.check-mode }}" = "full" ]; then
          CF_DRIFT_STATUS="${{ steps.cf-drift.outputs.cf_drift_status }}"
          CF_DRIFTED_RESOURCES="${{ steps.cf-drift.outputs.cf_drifted_resources }}"
          
          echo "  CF Drift Status: $CF_DRIFT_STATUS"
          echo "  CF Drifted Resources: $CF_DRIFTED_RESOURCES"
          
          # Combine drift counts - aggregates both CDK and CloudFormation drift for total count
          TOTAL_DRIFT_COUNT=$((CDK_CHANGES + CF_DRIFTED_RESOURCES))
          
          # Determine if drift detected - either CDK diff or CF drift indicates infrastructure mismatch
          if [ "$CDK_DRIFT" = "true" ] || [ "$CF_DRIFT_STATUS" = "DRIFTED" ]; then
            DRIFT_DETECTED=true
          fi
        else
          # Quick mode - only CDK diff - faster but less comprehensive than full check
          TOTAL_DRIFT_COUNT=$CDK_CHANGES
          if [ "$CDK_DRIFT" = "true" ]; then
            DRIFT_DETECTED=true
          fi
        fi

        # Determine drift severity - categorises drift by resource count to prioritise remediation
        if [ $TOTAL_DRIFT_COUNT -eq 0 ]; then
          DRIFT_SEVERITY="none"
        elif [ $TOTAL_DRIFT_COUNT -le 2 ]; then
          DRIFT_SEVERITY="low"
        elif [ $TOTAL_DRIFT_COUNT -le 5 ]; then
          DRIFT_SEVERITY="medium"
        elif [ $TOTAL_DRIFT_COUNT -le 10 ]; then
          DRIFT_SEVERITY="high"
        else
          DRIFT_SEVERITY="critical"
        fi

        echo ""
        echo "Final Drift Analysis:"
        echo "  Drift Detected: $DRIFT_DETECTED"
        echo "  Total Drift Count: $TOTAL_DRIFT_COUNT"
        echo "  Drift Severity: $DRIFT_SEVERITY"
        echo "  Drift Threshold: ${{ inputs.drift-threshold }}"

        # Set outputs
        echo "drift-detected=$DRIFT_DETECTED" >> $GITHUB_OUTPUT
        echo "drift-count=$TOTAL_DRIFT_COUNT" >> $GITHUB_OUTPUT
        echo "drift-severity=$DRIFT_SEVERITY" >> $GITHUB_OUTPUT

        # Check against threshold - allows configurable tolerance for non-critical drift
        # before failing the workflow
        if [ "$DRIFT_DETECTED" = "true" ]; then
          if [ $TOTAL_DRIFT_COUNT -gt ${{ inputs.drift-threshold }} ]; then
            echo ""
            echo "DRIFT THRESHOLD EXCEEDED"
            echo ""
            echo "Detected $TOTAL_DRIFT_COUNT drift(s), threshold is ${{ inputs.drift-threshold }}"
            echo ""
            echo "DRIFT REMEDIATION OPTIONS:"
            echo ""
            echo "REVIEW AND APPROVE CHANGES:"
            echo "   - Review drift details in artifacts"
            echo "   - If changes are intentional, update CDK code"
            echo "   - Deploy updated CDK to align infrastructure"
            echo ""
            echo "REVERT MANUAL CHANGES:"
            echo "   - Identify manually modified resources"
            echo "   - Revert changes through AWS console or CLI"
            echo "   - Re-run drift detection to verify"
            echo ""
            echo "FORCE DEPLOYMENT:"
            echo "   - Deploy CDK stack to override manual changes"
            echo "   - Use --force flag if necessary"
            echo "   - Monitor for any service disruptions"
            echo ""
            echo "DRIFT DETAILS:"
            if [ -f "cdk-diff-output.txt" ]; then
              echo "  - CDK diff saved to cdk-diff-output.txt"
            fi
            if [ -f "cf-drift-details.txt" ]; then
              echo "  - CloudFormation drift saved to cf-drift-details.txt"
            fi
            echo ""
            
            # Fail if threshold exceeded
            exit 1
          else
            echo ""
            echo "DRIFT DETECTED BUT WITHIN THRESHOLD"
            echo "$TOTAL_DRIFT_COUNT drift(s) detected, threshold is ${{ inputs.drift-threshold }}"
            echo "Consider reviewing and addressing drift soon"
          fi
        else
          echo ""
          echo "NO DRIFT DETECTED"
          echo "Infrastructure matches CDK configuration"
        fi

    - name: Upload Drift Artifacts
      if: always()
      shell: bash
      run: |
        echo "Preparing drift detection artifacts..."

        # Create drift report directory - always runs to preserve artifacts even on failure
        mkdir -p drift-report

        # Create summary report - generates markdown report for easy review in GitHub UI
        cat > drift-report/drift-summary.md << EOF
        # Infrastructure Drift Detection Report

        **Stack**: ${{ inputs.stack-name }}
        **Environment**: ${{ inputs.environment }}
        **Check Mode**: ${{ inputs.check-mode }}
        **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

        ## Results Summary

        - **Drift Detected**: ${{ steps.analyze.outputs.drift-detected }}
        - **Total Drift Count**: ${{ steps.analyze.outputs.drift-count }}
        - **Drift Severity**: ${{ steps.analyze.outputs.drift-severity }}
        - **Threshold**: ${{ inputs.drift-threshold }}

        ## CDK Analysis

        - **CDK Drift**: ${{ steps.cdk-diff.outputs.cdk_drift_detected }}
        - **CDK Changes**: ${{ steps.cdk-diff.outputs.cdk_changes_count }}
        EOF

        if [ "${{ inputs.check-mode }}" = "full" ]; then
          cat >> drift-report/drift-summary.md << EOF

        ## CloudFormation Analysis

        - **CF Drift Status**: ${{ steps.cf-drift.outputs.cf_drift_status }}
        - **CF Drifted Resources**: ${{ steps.cf-drift.outputs.cf_drifted_resources }}
        EOF
        fi

        cat >> drift-report/drift-summary.md << EOF

        ## Recommendations

        EOF

        if [ "${{ steps.analyze.outputs.drift-detected }}" = "true" ]; then
          cat >> drift-report/drift-summary.md << EOF
        **Action Required**: Drift detected in infrastructure

        1. Review detailed drift information in artifacts
        2. Determine if changes are intentional or accidental
        3. Update CDK code if changes should be preserved
        4. Deploy CDK stack to align infrastructure with code
        5. Consider implementing stricter change controls
        EOF
        else
          cat >> drift-report/drift-summary.md << EOF
        **No Action Required**: Infrastructure matches CDK configuration

        - Continue regular drift detection monitoring
        - Maintain current change control processes
        EOF
        fi

        # Copy detailed reports if they exist
        if [ -f "cdk-diff-output.txt" ]; then
          cp cdk-diff-output.txt drift-report/
        fi

        if [ -f "cf-drift-details.txt" ]; then
          cp cf-drift-details.txt drift-report/
        fi

        echo "Drift detection artifacts prepared in drift-report/"
        echo "Files created:"
        ls -la drift-report/
