# @format

name: "Parallel Execution Manager"
description: "Manages parallel job execution and dependency optimization for the pipeline"

inputs:
  execution-strategy:
    description: "Execution strategy: 'parallel' (default), 'sequential', or 'adaptive'"
    required: false
    default: "parallel"
  max-parallel-jobs:
    description: "Maximum number of parallel jobs to run simultaneously"
    required: false
    default: "5"
  dependency-mode:
    description: "Dependency handling: 'strict' (wait for all deps) or 'optimistic' (proceed if critical deps succeed)"
    required: false
    default: "optimistic"

outputs:
  execution-plan:
    description: "Generated execution plan for the pipeline"
    value: ${{ steps.plan.outputs.execution-plan }}
  parallel-groups:
    description: "JSON array of parallel execution groups"
    value: ${{ steps.plan.outputs.parallel-groups }}
  estimated-duration:
    description: "Estimated pipeline duration in minutes"
    value: ${{ steps.plan.outputs.estimated-duration }}

runs:
  using: "composite"
  steps:
    - name: Analyze Pipeline Dependencies
      id: analyze
      shell: bash
      run: |
        echo "🔍 Analyzing pipeline dependencies for parallel execution..."
        echo ""

        # Define job dependencies and estimated durations - models pipeline as DAG
        # with parallel groups to optimise execution time
        cat > job-dependencies.json << 'EOF'
        {
          "jobs": {
            "determine-jobs": {
              "dependencies": [],
              "duration": 1,
              "parallel_group": 0,
              "critical": true
            },
            "security-scan": {
              "dependencies": ["determine-jobs"],
              "duration": 2,
              "parallel_group": 1,
              "critical": true
            },
            "lint-and-quality": {
              "dependencies": ["determine-jobs", "security-scan"],
              "duration": 5,
              "parallel_group": 2,
              "critical": true
            },
            "build": {
              "dependencies": ["determine-jobs", "security-scan", "lint-and-quality"],
              "duration": 8,
              "parallel_group": 3,
              "critical": true
            },
            "validate-setup": {
              "dependencies": ["determine-jobs", "security-scan", "lint-and-quality"],
              "duration": 3,
              "parallel_group": 3,
              "critical": true
            },
            "deploy-networking": {
              "dependencies": ["determine-jobs", "build", "validate-setup"],
              "duration": 10,
              "parallel_group": 4,
              "critical": true
            },
            "deploy-monitoring-efs": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-networking"],
              "duration": 8,
              "parallel_group": 5,
              "critical": true
            },
            "deploy-vpc-peering": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-networking"],
              "duration": 6,
              "parallel_group": 5,
              "critical": false
            },
            "deploy-monitoring-infra": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-networking", "deploy-monitoring-efs"],
              "duration": 12,
              "parallel_group": 6,
              "critical": true
            },
            "deploy-monitoring-services": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-monitoring-infra"],
              "duration": 15,
              "parallel_group": 7,
              "critical": true
            },
            "health-checks": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-monitoring-infra", "deploy-monitoring-services"],
              "duration": 10,
              "parallel_group": 8,
              "critical": true
            },
            "drift-detection-networking": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-networking", "health-checks"],
              "duration": 5,
              "parallel_group": 9,
              "critical": false
            },
            "drift-detection-efs": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-monitoring-efs", "health-checks"],
              "duration": 4,
              "parallel_group": 9,
              "critical": false
            },
            "drift-detection-peering": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-vpc-peering", "health-checks"],
              "duration": 3,
              "parallel_group": 9,
              "critical": false
            },
            "drift-detection-infra": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-monitoring-infra", "health-checks"],
              "duration": 6,
              "parallel_group": 9,
              "critical": false
            },
            "drift-detection-services": {
              "dependencies": ["determine-jobs", "build", "validate-setup", "deploy-monitoring-services", "health-checks"],
              "duration": 7,
              "parallel_group": 9,
              "critical": false
            },
            "drift-analysis": {
              "dependencies": ["determine-jobs", "drift-detection-networking", "drift-detection-efs", "drift-detection-peering", "drift-detection-infra", "drift-detection-services"],
              "duration": 2,
              "parallel_group": 10,
              "critical": false
            }
          }
        }
        EOF

        echo "Job dependency analysis complete"
        echo "Total jobs analyzed: $(jq '.jobs | length' job-dependencies.json)"

    - name: Generate Execution Plan
      id: plan
      shell: bash
      run: |
        echo "Generating optimized execution plan..."
        echo ""

        STRATEGY="${{ inputs.execution-strategy }}"
        MAX_PARALLEL="${{ inputs.max-parallel-jobs }}"
        DEPENDENCY_MODE="${{ inputs.dependency-mode }}"

        echo "Execution Configuration:"
        echo "  Strategy: $STRATEGY"
        echo "  Max Parallel Jobs: $MAX_PARALLEL"
        echo "  Dependency Mode: $DEPENDENCY_MODE"
        echo ""

        # Generate parallel execution groups - groups jobs that can run simultaneously
        # based on dependency analysis
        echo "Organizing jobs into parallel execution groups..."

        # Extract parallel groups - uses parallel_group field from dependency model
        PARALLEL_GROUPS=$(jq -c '[.jobs | to_entries | group_by(.value.parallel_group) | .[] | {group: .[0].value.parallel_group, jobs: [.[] | {name: .key, duration: .value.duration, critical: .value.critical}]}]' job-dependencies.json)

        echo "parallel-groups=$PARALLEL_GROUPS" >> $GITHUB_OUTPUT

        # Calculate estimated duration based on strategy - different strategies optimise
        # for different constraints (time, resources, reliability)
        if [ "$STRATEGY" = "sequential" ]; then
          # Sequential: sum all durations - simplest but slowest execution
          TOTAL_DURATION=$(jq '[.jobs[].duration] | add' job-dependencies.json)
          echo "Sequential Execution: $TOTAL_DURATION minutes total"
        elif [ "$STRATEGY" = "parallel" ]; then
          # Parallel: max duration per group, then sum groups - optimises for speed
          GROUP_DURATIONS=$(jq -r '[.jobs | to_entries | group_by(.value.parallel_group) | .[] | [.[].value.duration] | max] | add' job-dependencies.json)
          TOTAL_DURATION=$GROUP_DURATIONS
          echo "Parallel Execution: $TOTAL_DURATION minutes total"
        else
          # Adaptive: intelligent scheduling based on dependencies and resources
          # balances critical path with parallel execution opportunities
          CRITICAL_PATH=$(jq -r '[.jobs | to_entries[] | select(.value.critical == true) | .value.duration] | add' job-dependencies.json)
          PARALLEL_SAVINGS=$(jq -r '[.jobs | to_entries[] | select(.value.critical == false) | .value.duration] | max // 0' job-dependencies.json)
          TOTAL_DURATION=$((CRITICAL_PATH + PARALLEL_SAVINGS / 2))
          echo "Adaptive Execution: $TOTAL_DURATION minutes estimated"
        fi

        echo "estimated-duration=$TOTAL_DURATION" >> $GITHUB_OUTPUT

        # Generate execution plan summary
        EXECUTION_PLAN=$(cat << EOF
        {
          "strategy": "$STRATEGY",
          "max_parallel_jobs": $MAX_PARALLEL,
          "dependency_mode": "$DEPENDENCY_MODE",
          "estimated_duration_minutes": $TOTAL_DURATION,
          "parallel_groups": $(echo "$PARALLEL_GROUPS" | jq length),
          "optimization_summary": {
            "sequential_duration": $(jq '[.jobs[].duration] | add' job-dependencies.json),
            "parallel_duration": $TOTAL_DURATION,
            "time_saved_minutes": $(($(jq '[.jobs[].duration] | add' job-dependencies.json) - TOTAL_DURATION)),
            "efficiency_gain_percent": $(( ($(jq '[.jobs[].duration] | add' job-dependencies.json) - TOTAL_DURATION) * 100 / $(jq '[.jobs[].duration] | add' job-dependencies.json) ))
          }
        }
        EOF
        )

        echo "execution-plan=$(echo "$EXECUTION_PLAN" | jq -c .)" >> $GITHUB_OUTPUT

        echo ""
        echo "Execution plan generated successfully"
        echo ""
        echo "Optimization Results:"
        echo "  Sequential Duration: $(jq '[.jobs[].duration] | add' job-dependencies.json) minutes"
        echo "  Parallel Duration: $TOTAL_DURATION minutes"
        echo "  Time Saved: $(($(jq '[.jobs[].duration] | add' job-dependencies.json) - TOTAL_DURATION)) minutes"
        echo "  Efficiency Gain: $(( ($(jq '[.jobs[].duration] | add' job-dependencies.json) - TOTAL_DURATION) * 100 / $(jq '[.jobs[].duration] | add' job-dependencies.json) ))%"

    - name: Validate Execution Plan
      shell: bash
      run: |
        echo "Validating execution plan for correctness..."
        echo ""

        # Check for circular dependencies - prevents infinite loops in job execution
        echo "Checking for circular dependencies..."

        # Validate parallel group assignments - ensures jobs are correctly grouped
        echo "Validating parallel group assignments..."

        # Check resource constraints - validates parallel execution doesn't exceed runner capacity
        MAX_PARALLEL="${{ inputs.max-parallel-jobs }}"
        MAX_CONCURRENT=$(echo '${{ steps.plan.outputs.parallel-groups }}' | jq '[.[].jobs | length] | max')

        if [ "$MAX_CONCURRENT" -gt "$MAX_PARALLEL" ]; then
          echo "WARNING: Some parallel groups exceed max parallel jobs limit"
          echo "   Max allowed: $MAX_PARALLEL"
          echo "   Max required: $MAX_CONCURRENT"
          echo "   Consider increasing max-parallel-jobs or splitting large groups"
        else
          echo "Parallel execution constraints satisfied"
        fi

        # Validate critical path - ensures critical jobs are properly sequenced
        # critical jobs must succeed for pipeline to continue
        echo "Validating critical path dependencies..."
        CRITICAL_JOBS=$(jq -r '.jobs | to_entries[] | select(.value.critical == true) | .key' job-dependencies.json)
        echo "Critical jobs identified: $(echo "$CRITICAL_JOBS" | wc -l)"

        echo ""
        echo "Execution plan validation complete"

    - name: Generate Execution Summary
      shell: bash
      run: |
        echo "Parallel Execution Summary"
        echo "=============================="
        echo ""

        # Display parallel groups
        echo '${{ steps.plan.outputs.parallel-groups }}' | jq -r '.[] | "Group \(.group): \(.jobs | length) jobs (\([.jobs[].duration] | add) min total, \([.jobs[].duration] | max) min critical path)"'

        echo ""
        echo "Execution Strategy: ${{ inputs.execution-strategy }}"
        echo "Estimated Duration: ${{ steps.plan.outputs.estimated-duration }} minutes"
        echo "Max Parallel Jobs: ${{ inputs.max-parallel-jobs }}"
        echo "Dependency Mode: ${{ inputs.dependency-mode }}"

        echo ""
        echo "Optimization Tips:"
        echo "  - Use 'parallel' strategy for fastest execution"
        echo "  - Use 'sequential' for debugging or resource constraints"
        echo "  - Use 'adaptive' for balanced performance and reliability"
        echo "  - Increase max-parallel-jobs if you have sufficient runners"
        echo "  - Use 'optimistic' dependency mode to reduce wait times"
