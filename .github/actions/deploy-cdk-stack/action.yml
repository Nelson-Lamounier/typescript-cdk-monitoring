# @format

# .github/actions/deploy-cdk-stack/action.yml // test
name: "Deploy CDK Stack"
description: "Deploys a CDK stack with validation and error handling"

inputs:
  stack-name:
    description: "Name of the CDK stack to deploy"
    required: true
  environment:
    description: "Environment (pipeline, development, production)"
    required: true
  project-name:
    description: "Project name for multi-project infrastructure"
    required: false
    default: "monitoring"
  aws-account-id:
    description: "AWS Account ID"
    required: true
  aws-region:
    description: "AWS Region"
    required: true
  dev-vpc-id:
    description: "Development VPC ID (optional)"
    required: false
    default: ""
  dev-account-id:
    description: "Development Account ID (optional)"
    required: false
    default: ""
  additional-args:
    description: "Additional CDK deploy arguments"
    required: false
    default: "--require-approval never"

outputs:
  deployment-status:
    description: "Status of deployment (success/failure)"
    value: ${{ steps.deploy.outputs.status }}
  stack-outputs:
    description: "CloudFormation stack outputs (JSON)"
    value: ${{ steps.deploy.outputs.stack_outputs }}

runs:
  using: "composite"
  steps:
    - name: Validate Environment
      shell: bash
      run: |
        npx tsx scripts/deployment/validate-environment.ts \
          --stack-name "${{ inputs.stack-name }}" \
          --environment "${{ inputs.environment }}" \
          --project-name "${{ inputs.project-name }}" \
          --aws-account-id "${{ inputs.aws-account-id }}" \
          --aws-region "${{ inputs.aws-region }}" \
          --dev-vpc-id "${{ inputs.dev-vpc-id }}" \
          --dev-account-id "${{ inputs.dev-account-id }}"

    - name: Verify CDK Bootstrap
      shell: bash
      run: |
        # Verify bootstrap - CDK can verify cross-account bootstrap if stacks are defined with target account
        # This works because CDK uses the bootstrap deploy role which has CloudFormation read permissions
        make verify-bootstrap \
          AWS_ACCOUNT_ID="${{ inputs.aws-account-id }}" \
          ENVIRONMENT="${{ inputs.environment }}" \
          AWS_REGION="${{ inputs.aws-region }}" \
          PROJECT_NAME="${{ inputs.project-name }}"

    - name: Deploy Stack
      id: deploy
      shell: bash
      run: |
        npx tsx scripts/deployment/deploy-stack.ts \
          --stack-name "${{ inputs.stack-name }}" \
          --environment "${{ inputs.environment }}" \
          --project-name "${{ inputs.project-name }}" \
          --aws-account-id "${{ inputs.aws-account-id }}" \
          --aws-region "${{ inputs.aws-region }}" \
          --dev-vpc-id "${{ inputs.dev-vpc-id }}" \
          --dev-account-id "${{ inputs.dev-account-id }}" \
          --additional-args "${{ inputs.additional-args }}"
      env:
        # Set GitHub Actions output via script
        GITHUB_OUTPUT: ${{ github.output }}
        GITHUB_ACTIONS: "true"
